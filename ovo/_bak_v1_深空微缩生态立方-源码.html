<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>深空微缩生态立方 · 3D Diorama</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    overflow:hidden;
    background:#05050f;
    color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  #container{position:fixed;inset:0}
  #container canvas{display:block}
  .title{
    position:fixed;top:22px;left:26px;
    font-size:13px;letter-spacing:.28em;text-transform:uppercase;
    color:rgba(220,236,255,.72);pointer-events:none;
  }
  .title b{display:block;font-weight:600;font-size:17px;letter-spacing:.12em;margin-top:6px;color:#eaf4ff}
  .ui-hint{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    font-size:13px;opacity:.6;pointer-events:none;text-align:center;white-space:nowrap;
  }
</style>
</head>
<body>
<div id="container"></div>
<div class="title">Deep Space Diorama<b>深空微缩生态立方</b></div>
<div class="ui-hint">🖱️ 拖拽旋转 · 滚轮缩放 · 昼夜自动循环</div>

<script src="../vendor/three.min.js"></script>
<script>
(() => {
  'use strict';

  /* ---------------- 基础三件套 ---------------- */
  const container = document.getElementById('container');
  const scene = new THREE.Scene();
  const NIGHT = new THREE.Color(0x05050f);
  const DAWN  = new THREE.Color(0x101d33);
  scene.background = NIGHT.clone();
  scene.fog = new THREE.FogExp2(NIGHT.clone(), 0.028);

  const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
  camera.position.set(14, 11, 14);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  container.appendChild(renderer.domElement);

  /* ---------------- 环境贴图（程序化渐变，让玻璃/水面有反射） ---------------- */
  const envTexture = (() => {
    const w = 128, h = 64;
    const data = new Uint8Array(w * h * 4);
    const sky = [0.05, 0.09, 0.20], horizon = [0.42, 0.52, 0.72], ground = [0.04, 0.05, 0.07];
    for (let y = 0; y < h; y++) {
      const v = y / (h - 1);
      const t = v < 0.5 ? v / 0.5 : (v - 0.5) / 0.5;
      const a = v < 0.5 ? sky : horizon;
      const b = v < 0.5 ? horizon : ground;
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        data[i]     = (a[0] + (b[0] - a[0]) * t) * 255;
        data[i + 1] = (a[1] + (b[1] - a[1]) * t) * 255;
        data[i + 2] = (a[2] + (b[2] - a[2]) * t) * 255;
        data[i + 3] = 255;
      }
    }
    const tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.needsUpdate = true;
    const pmrem = new THREE.PMREMGenerator(renderer);
    const rt = pmrem.fromEquirectangular(tex);
    tex.dispose();
    pmrem.dispose();
    return rt.texture;
  })();
  scene.environment = envTexture;

  /* ---------------- 星空 ---------------- */
  (function createStarfield() {
    const count = 2200;
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      pos[i * 3]     = (Math.random() - 0.5) * 220;
      pos[i * 3 + 1] = (Math.random() - 0.5) * 220;
      pos[i * 3 + 2] = (Math.random() - 0.5) * 220;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({
      color: 0xffffff, size: 0.32, transparent: true, opacity: 0.8,
      sizeAttenuation: true, depthWrite: false
    });
    scene.add(new THREE.Points(geo, mat));
  })();

  /* ---------------- 立方体内部世界 ---------------- */
  const boxSize = 8.2;
  const glassGroup = new THREE.Group();
  glassGroup.position.y = 0.2;
  scene.add(glassGroup);

  const worldContainer = new THREE.Group();
  worldContainer.position.y = -boxSize / 2 + 0.45;
  glassGroup.add(worldContainer);

  /* 地形高度函数（同时用于贴地与摆放） */
  function terrainHeight(x, z) {
    let h = Math.sin(x * 0.72) * Math.cos(z * 0.72) * 1.15
          + Math.sin(x * 1.4 + 1.2) * Math.cos(z * 1.35) * 0.45;
    const d = Math.hypot(x, z);
    if (d < 2.4) h += (2.4 - d) * 1.25;              // 中央雪山
    const riverX = Math.sin(z * 1.8) * 0.75;
    const dRiver = Math.abs(x - riverX);
    if (dRiver < 0.55) h -= 0.9 * (0.55 - dRiver) / 0.55;   // 蜿蜒河道
    const dLake = Math.hypot(x + 0.45, z + 1.4);
    if (dLake < 1.2) h -= (1.2 - dLake) * 0.6;              // 湖泊盆地
    return Math.max(-0.85, h);
  }

  /* ---------------- 地形（顶点色：草地 / 岩石 / 雪） ---------------- */
  (function createTerrain() {
    const size = 7.2, seg = 96;
    const geo = new THREE.PlaneGeometry(size, size, seg, seg);
    geo.rotateX(-Math.PI / 2);

    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      pos.setY(i, terrainHeight(pos.getX(i), pos.getZ(i)));
    }
    geo.computeVertexNormals();

    const nrm = geo.attributes.normal;
    const colors = new Float32Array(pos.count * 3);
    const cGrassA = new THREE.Color(0x4f8f4a);
    const cGrassB = new THREE.Color(0x86bd63);
    const cRock   = new THREE.Color(0x8b8d95);
    const cSnow   = new THREE.Color(0xf3f8ff);
    const cSand   = new THREE.Color(0xc8b184);
    const tmp = new THREE.Color();

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const ny = nrm.getY(i);

      if (y > 1.5) {
        tmp.copy(cSnow);
      } else if (y > 0.9) {
        const t = (y - 0.9) / 0.6;
        tmp.copy(cRock).lerp(cSnow, t * t);
      } else if (y < -0.3) {
        tmp.copy(cSand).lerp(cGrassB, 0.35);
      } else {
        tmp.copy(cGrassA).lerp(cGrassB, 0.5 + 0.5 * Math.sin(x * 2.7 + z * 1.9));
      }
      if (ny < 0.66 && y > 0.15) tmp.lerp(cRock, 0.5);   // 陡坡露岩

      colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.92, metalness: 0.02
    });
    worldContainer.add(new THREE.Mesh(geo, mat));
  })();

  /* ---------------- 湖泊 ---------------- */
  (function createLake() {
    const geo = new THREE.CircleGeometry(1.06, 48);
    geo.rotateX(-Math.PI / 2);
    const mat = new THREE.MeshPhysicalMaterial({
      color: 0x2f6f9e,
      roughness: 0.06,
      metalness: 0.0,
      transmission: 0.55,
      thickness: 0.4,
      ior: 1.33,
      transparent: true,
      opacity: 0.92,
      envMapIntensity: 1.2
    });
    const lake = new THREE.Mesh(geo, mat);
    lake.position.set(-0.45, -0.42, -1.4);
    worldContainer.add(lake);
  })();

  /* ---------------- 松树 ---------------- */
  function createTree(x, z, scale) {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.07 * scale, 0.11 * scale, 0.65 * scale, 8),
      new THREE.MeshStandardMaterial({ color: 0x6b4c38, roughness: 0.9 })
    );
    trunk.position.y = 0.32 * scale;
    g.add(trunk);

    const crownGeo = new THREE.ConeGeometry(0.46 * scale, 1.05 * scale, 10);
    const crownMat = new THREE.MeshStandardMaterial({ color: 0x2f6b3f, roughness: 0.88 });
    for (let ly = 0; ly < 3; ly++) {
      const crown = new THREE.Mesh(crownGeo, crownMat);
      crown.scale.setScalar(1 - ly * 0.28);
      crown.position.y = (0.72 + ly * 0.40) * scale;
      crown.rotation.y = ly * 0.7;
      g.add(crown);
    }
    g.position.set(x, terrainHeight(x, z) - 0.05, z);
    return g;
  }

  const treePositions = [
    [-2.8, -2.2], [-2.1, -0.6], [-3.0, 1.2], [-1.4, 2.5], [0.4, 2.2],
    [2.6, -1.8], [2.2, 0.6], [1.5, 2.7], [-0.4, -2.7], [2.9, 2.3]
  ];
  treePositions.forEach(([px, pz]) => {
    worldContainer.add(createTree(px, pz, 0.65 + Math.random() * 0.45));
  });

  /* ---------------- 小鹿 ---------------- */
  (function createDeer() {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0xc9946c, roughness: 0.9 });
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.30, 4, 10), mat);
    body.rotation.z = Math.PI / 2;
    body.position.y = 0.26;
    g.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.105, 10, 8), mat);
    head.position.set(0.27, 0.36, 0);
    g.add(head);

    const legGeo = new THREE.CylinderGeometry(0.022, 0.022, 0.24, 6);
    [[-0.13, 0.09], [-0.13, -0.09], [0.12, 0.09], [0.12, -0.09]].forEach(([lx, lz]) => {
      const leg = new THREE.Mesh(legGeo, mat);
      leg.position.set(lx, 0.12, lz);
      g.add(leg);
    });

    const hornGeo = new THREE.CylinderGeometry(0.008, 0.014, 0.16, 5);
    const hornMat = new THREE.MeshStandardMaterial({ color: 0xe8dcc0, roughness: 0.6 });
    [-0.05, 0.05].forEach(lz => {
      const horn = new THREE.Mesh(hornGeo, hornMat);
      horn.position.set(0.30, 0.50, lz);
      horn.rotation.z = -0.35 * Math.sign(lz || 1);
      g.add(horn);
    });

    const x = 1.85, z = -0.85;
    g.position.set(x, terrainHeight(x, z) + 0.02, z);
    g.rotation.y = -0.9;
    worldContainer.add(g);
  })();

  /* ---------------- 云 ---------------- */
  const clouds = [];
  (function createClouds() {
    const cloudMat = new THREE.MeshStandardMaterial({
      color: 0xffffff, transparent: true, opacity: 0.5, roughness: 1, metalness: 0
    });
    [[-2.2, 2.9, -1.0], [1.8, 3.2, 1.2], [0.0, 3.4, -2.0]].forEach(([x, y, z]) => {
      const g = new THREE.Group();
      for (let i = 0; i < 5; i++) {
        const s = 0.22 + Math.random() * 0.32;
        const sph = new THREE.Mesh(new THREE.SphereGeometry(s, 10, 8), cloudMat);
        sph.position.set((Math.random() - 0.5) * 0.8, (Math.random() - 0.5) * 0.32, (Math.random() - 0.5) * 0.8);
        g.add(sph);
      }
      g.scale.setScalar(0.85 + Math.random() * 0.4);
      g.position.set(x, y, z);
      worldContainer.add(g);
      clouds.push(g);
    });
  })();

  /* ---------------- 夜晚萤火 ---------------- */
  const fireflies = (() => {
    const count = 110;
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const x = (Math.random() - 0.5) * 6.6;
      const z = (Math.random() - 0.5) * 6.6;
      pos[i * 3]     = x;
      pos[i * 3 + 1] = terrainHeight(x, z) + 0.2 + Math.random() * 2.2;
      pos[i * 3 + 2] = z;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({
      color: 0xffe6a8, size: 0.085, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
    });
    const points = new THREE.Points(geo, mat);
    worldContainer.add(points);
    return { points, mat, geo };
  })();

  /* ---------------- 玻璃立方体外壳 ---------------- */
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    metalness: 0.0,
    roughness: 0.04,
    transmission: 0.94,
    thickness: 0.5,
    ior: 1.5,
    envMapIntensity: 1.6,
    attenuationColor: new THREE.Color(0x9dc8ff),
    attenuationDistance: 6,
    side: THREE.DoubleSide
  });
  const glassGeo = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
  glassGroup.add(new THREE.Mesh(glassGeo, glassMat));

  const edgeGeo = new THREE.EdgesGeometry(glassGeo, 12);
  const edgeMat = new THREE.LineBasicMaterial({ color: 0xd8ecff, transparent: true, opacity: 0.7 });
  glassGroup.add(new THREE.LineSegments(edgeGeo, edgeMat));

  /* ---------------- 灯光 & 昼夜 ---------------- */
  const hemi = new THREE.HemisphereLight(0x9fc4ff, 0x2c2a24, 0.55);
  scene.add(hemi);

  const sunLight = new THREE.DirectionalLight(0xfff3dd, 2.6);
  sunLight.position.set(9, 12, 6);
  scene.add(sunLight);

  const moonLight = new THREE.DirectionalLight(0xaebfff, 0.0);
  moonLight.position.set(-9, 10, -5);
  scene.add(moonLight);

  const rimLight = new THREE.PointLight(0xffd9a8, 18, 22, 2);
  rimLight.position.set(-5.5, 6.5, 4.5);
  scene.add(rimLight);

  const clock = new THREE.Clock();
  const DAY_SEC = 36;

  /* ---------------- 轻量轨道控制（自带，不依赖 examples） ---------------- */
  const controls = (() => {
    const target = new THREE.Vector3(0, 0.3, 0);
    const el = renderer.domElement;
    const s = {
      radius: 21, theta: 0.78, phi: 1.15,
      tRadius: 21, tTheta: 0.78, tPhi: 1.15,
      dragging: false, lastX: 0, lastY: 0, pinch: 0
    };
    const clampPhi = v => Math.min(2.45, Math.max(0.28, v));
    const clampR = v => Math.min(34, Math.max(8.5, v));

    el.addEventListener('pointerdown', e => {
      s.dragging = true; s.lastX = e.clientX; s.lastY = e.clientY;
      el.setPointerCapture(e.pointerId);
      el.style.cursor = 'grabbing';
    });
    el.addEventListener('pointermove', e => {
      if (!s.dragging) return;
      s.tTheta -= (e.clientX - s.lastX) * 0.006;
      s.tPhi = clampPhi(s.tPhi - (e.clientY - s.lastY) * 0.005);
      s.lastX = e.clientX; s.lastY = e.clientY;
    });
    const end = e => {
      s.dragging = false;
      el.style.cursor = 'grab';
      if (e && e.pointerId !== undefined && el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('pointerleave', end);
    el.style.cursor = 'grab';

    el.addEventListener('wheel', e => {
      e.preventDefault();
      s.tRadius = clampR(s.tRadius * Math.exp(e.deltaY * 0.0012));
    }, { passive: false });

    el.addEventListener('touchmove', e => {
      if (e.touches.length !== 2) return;
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy);
      if (s.pinch) s.tRadius = clampR(s.tRadius * (s.pinch / d));
      s.pinch = d;
    }, { passive: false });
    el.addEventListener('touchend', () => { s.pinch = 0; });

    return {
      update() {
        s.radius += (s.tRadius - s.radius) * 0.12;
        s.theta  += (s.tTheta  - s.theta)  * 0.14;
        s.phi    += (s.tPhi    - s.phi)    * 0.14;
        const sp = Math.sin(s.phi);
        camera.position.set(
          target.x + s.radius * sp * Math.sin(s.theta),
          target.y + s.radius * Math.cos(s.phi),
          target.z + s.radius * sp * Math.cos(s.theta)
        );
        camera.lookAt(target);
      }
    };
  })();

  /* ---------------- 尺寸自适应 ---------------- */
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  /* ---------------- 主循环 ---------------- */
  function animate() {
    const t = clock.getElapsedTime();
    const cycle = (t % DAY_SEC) / DAY_SEC;
    const sunAngle = cycle * Math.PI * 2;
    const daylight = Math.max(0, Math.cos(sunAngle));   // 0 夜 → 1 正午
    const night = Math.max(0, -Math.cos(sunAngle));

    sunLight.intensity = daylight * 2.8;
    sunLight.position.set(Math.cos(sunAngle) * 9, Math.sin(sunAngle) * 9 + 3, 5);
    moonLight.intensity = night * 1.3;
    hemi.intensity = 0.18 + daylight * 0.5;
    rimLight.intensity = 12 + night * 10;
    renderer.toneMappingExposure = 0.85 + daylight * 0.45;

    scene.background.copy(NIGHT).lerp(DAWN, daylight * 0.55);
    scene.fog.color.copy(scene.background);
    fireflies.mat.opacity = night * 0.9;

    // 云朵漂移
    clouds.forEach((cg, idx) => {
      cg.position.x += Math.sin(t * 0.12 + idx) * 0.0022;
      cg.position.z += Math.cos(t * 0.09 + idx) * 0.0018;
      cg.rotation.y += 0.0012;
    });

    // 萤火轻飘
    const fp = fireflies.geo.attributes.position;
    for (let i = 0; i < fp.count; i++) {
      fp.setY(i, fp.getY(i) + Math.sin(t * 0.8 + i) * 0.0009);
    }
    fp.needsUpdate = true;

    // 立方体悬浮呼吸
    glassGroup.position.y = 0.2 + Math.sin(t * 0.45) * 0.12;
    glassGroup.rotation.y += 0.0011;

    controls.update();
    renderer.render(scene, camera);
  }
  renderer.setAnimationLoop(animate);
})();
</script>
</body>
</html>
