<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>深空微缩生态立方 · 3D Diorama</title>
<!--
  3D 模型来源（通过 poly.pizza 获取，已烘成顶点色内嵌）：
  · 松树丛 / 岩石  — CC0 / Public Domain — Quaternius — https://poly.pizza/u/Quaternius
  · 阔叶树        — CC BY 3.0 — Marc Solà — https://poly.pizza/m/6Yjt8nIwLsD
  · 绵羊          — CC BY 3.0 — Pixel — https://poly.pizza/m/8jHkcfv4tH
  · 老鹰          — CC BY 3.0 — Poly by Google — https://poly.pizza/m/8Ph79kHbt9s
  · 低多边雪山（未启用） — CC BY 3.0 — jeremy — https://poly.pizza/m/0Fl55ZzsVzT
  其余（地形、水、云、玻璃、粒子、后期）为程序化生成。
  CC BY 3.0：保留署名即可商用/修改，详见 https://creativecommons.org/licenses/by/3.0/
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    overflow:hidden;background:#04040b;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #container{position:fixed;inset:0}
  #container canvas{display:block;opacity:0;transition:opacity 1.6s ease}
  #container canvas.ready{opacity:1}
  .title{
    position:fixed;top:26px;left:30px;pointer-events:none;
    font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:rgba(198,220,255,.55);
  }
  .title b{display:block;margin-top:8px;font-size:19px;font-weight:600;letter-spacing:.14em;color:rgba(238,247,255,.92)}
  .ui-hint{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    font-size:12px;letter-spacing:.08em;opacity:.42;pointer-events:none;white-space:nowrap;
  }
  #err{
    position:fixed;inset:0;padding:26px;background:rgba(10,0,0,.94);
    color:#ff9b9b;font:12px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;
    display:none;z-index:99;overflow:auto;
  }
</style>
</head>
<body>
<div id="container"></div>
<div class="title">Deep Space Diorama<b>深空微缩生态立方</b></div>
<div class="ui-hint">拖拽旋转 · 滚轮缩放 · 昼夜自动流转</div>
<div id="err"></div>

<script src="../vendor/three.min.js"></script>
<script id="model-data" type="application/json">__MODEL_DATA__</script>
<script>
(() => {
  'use strict';

  /* ================= 调试：错误直接显示在画面上 ================= */
  const errBox = document.getElementById('err');
  function fail(msg) {
    errBox.style.display = 'block';
    errBox.textContent += msg + '\n';
  }
  addEventListener('error', e => fail('ERROR: ' + (e.message || e.error) + '\n' + (e.filename || '') + ':' + e.lineno));
  addEventListener('unhandledrejection', e => fail('REJECT: ' + e.reason));

  const Q = new URLSearchParams(location.search);
  const FREEZE = Q.has('t') ? parseFloat(Q.get('t')) : null;   // ?t=12 固定时间，便于截图
  const LOWQ = Q.has('lowq');

  /* ================= 小工具 ================= */
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  function smoothstep(a, b, x) {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(20261108);

  /* ================= 外部低模（poly.pizza CC0/CC-BY，已烘成顶点色） ================= */
  const MODEL_DATA = (() => {
    try { return JSON.parse(document.getElementById('model-data').textContent || '{}'); }
    catch (e) { console.warn('model data parse failed', e); return {}; }
  })();

  function buildModel(key, opts) {
    opts = opts || {};
    const src = MODEL_DATA[key];
    const g = new THREE.Group();
    if (!src) return g;
    const mat = new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: opts.roughness != null ? opts.roughness : 0.88,
      metalness: 0.0, envMapIntensity: 0.35,
      color: opts.tint || 0xffffff
    });
    for (const part of src.parts) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(part.p, 3));
      if (part.n) geo.setAttribute('normal', new THREE.Float32BufferAttribute(part.n, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(part.c, 3));
      if (part.i) geo.setIndex(part.i);
      if (!part.n) geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      g.add(mesh);
    }
    if (opts.scale) g.scale.setScalar(opts.scale);
    return g;
  }

  // 老鹰：模型翅膀沿 Y，转成沿 Z；带翼展权重，用顶点着色器扑翼
  function buildEagle() {
    const src = MODEL_DATA.eagle;
    const g = new THREE.Group();
    if (!src) return g;
    const flap = { value: 0 };
    for (const part of src.parts) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(part.p, 3));
      if (part.n) geo.setAttribute('normal', new THREE.Float32BufferAttribute(part.n, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(part.c, 3));
      if (part.i) geo.setIndex(part.i);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      let maxZ = 0.0001;
      for (let i = 0; i < pos.count; i++) maxZ = Math.max(maxZ, Math.abs(pos.getZ(i)));
      const aw = new Float32Array(pos.count);
      for (let i = 0; i < pos.count; i++) {
        const z = pos.getZ(i);
        const w = Math.min(1, Math.abs(z) / (maxZ * 0.72));
        aw[i] = Math.sign(z) * w * w;
      }
      geo.setAttribute('aWing', new THREE.BufferAttribute(aw, 1));
      if (!part.n) geo.computeVertexNormals();
      const mat = new THREE.MeshStandardMaterial({ vertexColors: false, color: 0x6d5c4a, roughness: 0.85, metalness: 0.0, envMapIntensity: 0.3 });
      mat.onBeforeCompile = sh => {
        sh.uniforms.uFlap = flap;
        sh.vertexShader = 'uniform float uFlap;\nattribute float aWing;\n' + sh.vertexShader.replace(
          '#include <begin_vertex>',
          ['#include <begin_vertex>',
            'float ang = uFlap * aWing;',
            'float ca = cos(ang), sa = sin(ang);',
            'vec3 tv = transformed;',
            'transformed.y = tv.y * ca - tv.z * sa;',
            'transformed.z = tv.y * sa + tv.z * ca;'].join('\n')
        );
      };
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      g.add(mesh);
    }
    g.userData.flap = flap;
    return g;
  }

  /* ================= 渲染器 / 场景 / 相机 ================= */
  const container = document.getElementById('container');
  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', stencil: false });
  const DPR = Math.min(devicePixelRatio || 1, 1.6);
  renderer.setPixelRatio(DPR);
  renderer.setSize(innerWidth, innerHeight);
  const RAW = Q.has('raw');                                 // 调试：绕过后期，直接渲染
  if (RAW) { renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; }
  renderer.outputColorSpace = RAW ? THREE.SRGBColorSpace : THREE.LinearSRGBColorSpace;   // 最终 sRGB 在合成着色器里做
  renderer.toneMapping = THREE.NoToneMapping;               // ACES 也在合成里做
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const NIGHT_SKY = new THREE.Color(0x05060f);
  const DAY_SKY = new THREE.Color(0x121b30);
  scene.background = NIGHT_SKY.clone();
  scene.fog = new THREE.FogExp2(NIGHT_SKY.clone(), 0.007);

  const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 600);

  /* ================= 程序化贴图 ================= */
  function makeCanvas(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    return c;
  }
  function radialTexture(size = 128, inner = 1, power = 2.2) {
    const c = makeCanvas(size), g = c.getContext('2d');
    const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      grd.addColorStop(t, 'rgba(255,255,255,' + (inner * Math.pow(1 - t, power)).toFixed(4) + ')');
    }
    g.fillStyle = grd;
    g.fillRect(0, 0, size, size);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  function mistTexture(size = 256) {
    const c = makeCanvas(size), g = c.getContext('2d');
    g.clearRect(0, 0, size, size);
    for (let i = 0; i < 26; i++) {
      const x = size * (0.15 + rnd() * 0.7);
      const y = size * (0.3 + rnd() * 0.4);
      const r = size * (0.08 + rnd() * 0.16);
      const grd = g.createRadialGradient(x, y, 0, x, y, r);
      const a = 0.10 + rnd() * 0.14;
      grd.addColorStop(0, 'rgba(255,255,255,' + a.toFixed(3) + ')');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  const TEX_GLOW = radialTexture(128, 1.0, 2.6);
  const TEX_SOFT = radialTexture(128, 1.0, 1.5);
  const TEX_MIST = mistTexture(256);

  /* ================= 环境贴图（渐变天空 → PMREM） ================= */
  const envTex = (() => {
    const w = 192, h = 96, data = new Uint8Array(w * h * 4);
    for (let y = 0; y < h; y++) {
      const v = y / (h - 1);
      let r, g, b;
      if (v < 0.5) {
        const t = v / 0.5;
        r = lerp(0.03, 0.15, t); g = lerp(0.05, 0.19, t); b = lerp(0.11, 0.28, t);
      } else {
        const t = (v - 0.5) / 0.5;
        r = lerp(0.15, 0.03, t); g = lerp(0.19, 0.03, t); b = lerp(0.28, 0.04, t);
      }
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        data[i] = r * 255; data[i + 1] = g * 255; data[i + 2] = b * 255; data[i + 3] = 255;
      }
    }
    const tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.needsUpdate = true;
    const pmrem = new THREE.PMREMGenerator(renderer);
    const rt = pmrem.fromEquirectangular(tex);
    tex.dispose(); pmrem.dispose();
    return rt.texture;
  })();
  scene.environment = envTex;

  /* ================= 背景：星空 / 星云 / 散景 ================= */
  const bgGroup = new THREE.Group();
  scene.add(bgGroup);

  (function stars() {
    const count = 2600;
    const pos = new Float32Array(count * 3);
    const size = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      const r = 90 + rnd() * 180;
      const th = rnd() * Math.PI * 2;
      const ph = Math.acos(2 * rnd() - 1);
      pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
      pos[i * 3 + 1] = r * Math.cos(ph) * 0.7;
      pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
      size[i] = 0.6 + rnd() * 2.2;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uOpacity: { value: 0.9 }, uPix: { value: DPR } },
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: `
        attribute float aSize;
        uniform float uPix, uTime;
        varying float vTw;
        void main(){
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          vTw = 0.55 + 0.45 * sin(uTime * 1.7 + aSize * 21.0);
          gl_PointSize = aSize * uPix * 1.5;
        }`,
      fragmentShader: `
        uniform float uOpacity;
        varying float vTw;
        void main(){
          vec2 d = gl_PointCoord - 0.5;
          float a = smoothstep(0.5, 0.0, length(d));
          gl_FragColor = vec4(vec3(0.85, 0.92, 1.0) * a * vTw * uOpacity, 1.0);
        }`
    });
    bgGroup.add(new THREE.Points(geo, mat));
    bgGroup.userData.starMat = mat;
  })();

  const nebulaSprites = [];
  [[-46, 14, -78, 96, 0x35507f, 0.16],
   [58, -8, -92, 120, 0x4a3a6e, 0.13],
   [8, 40, -110, 150, 0x2a4f68, 0.10]].forEach(([x, y, z, s, col, op]) => {
    const m = new THREE.SpriteMaterial({
      map: TEX_SOFT, color: col, transparent: true, opacity: op,
      blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false
    });
    const sp = new THREE.Sprite(m);
    sp.position.set(x, y, z);
    sp.scale.set(s, s * 0.62, 1);
    bgGroup.add(sp);
    nebulaSprites.push(m);
  });

  // 远处的散景光斑（虚化背景的一部分）
  const bokehSprites = [];
  (function bokeh() {
    for (let i = 0; i < 34; i++) {
      const m = new THREE.SpriteMaterial({
        map: TEX_GLOW,
        color: new THREE.Color().setHSL(0.55 + rnd() * 0.12, 0.5, 0.6),
        transparent: true, opacity: 0.05 + rnd() * 0.10,
        blending: THREE.AdditiveBlending, depthWrite: false
      });
      const s = 1.6 + rnd() * 5.0;
      const sp = new THREE.Sprite(m);
      const r = 14 + rnd() * 26, a = rnd() * Math.PI * 2;
      sp.position.set(Math.cos(a) * r, -6 + rnd() * 18, Math.sin(a) * r - 8);
      sp.scale.set(s, s, 1);
      sp.userData = { base: sp.position.clone() };
      bgGroup.add(sp);
      bokehSprites.push(sp);
    }
  })();

  /* ================= 立方体 / 世界容器 ================= */
  const BOX = 7.8;
  const glassGroup = new THREE.Group();
  glassGroup.position.y = 0.15;
  scene.add(glassGroup);

  const world = new THREE.Group();
  world.position.y = -1.55;
  glassGroup.add(world);

  /* ================= 地形高度函数 ================= */
  const HALF = 3.6;
  function heightAt(x, z) {
    let h = 0.26 * Math.sin(x * 1.05 + 0.6) * Math.cos(z * 0.95 - 0.2)
          + 0.15 * Math.sin(x * 2.2 - 1.0) * Math.cos(z * 2.0 + 0.4)
          + 0.08 * Math.sin(x * 3.7 + 2.0) * Math.cos(z * 3.3 + 1.1);

    // 雪山（偏左后）
    const mx = (x + 0.78) / 1.05, mz = (z - 0.72) / 1.10;
    const dm2 = mx * mx + mz * mz;
    h += 2.30 * Math.exp(-dm2 * 0.90) + 0.55 * Math.exp(-dm2 * 0.22);
    // 四条放射状山脊，让轮廓长出硬折线
    const th = Math.atan2(mz, mx);
    h += 0.55 * Math.pow(Math.max(0.0, Math.sin(th * 4.0 + 1.1)), 3.0) * Math.exp(-dm2 * 0.55);
    h += 0.28 * Math.pow(Math.max(0.0, Math.sin(th * 7.0 - 0.6)), 4.0) * Math.exp(-dm2 * 0.9);

    // 山脊起伏，避免变成光滑奶油锥
    const ridge = Math.exp(-dm2 * 0.9);
    h += ridge * 0.16 * Math.sin(Math.atan2(mz, mx) * 3.0 + dm2 * 2.2);
    h += ridge * 0.09 * Math.sin(x * 4.1 + z * 3.3);
    h += ridge * 0.05 * Math.sin(x * 10.7 + z * 9.1) * Math.cos(x * 7.3 - z * 11.7);

    // 台地：右下角（x+z 大）比山脚低一层，断崖处就是瀑布
    h -= 1.05 * smoothstep(1.66, 1.88, x + z);
    h += 0.035 * Math.sin(x * 8.3) * Math.sin(z * 7.9)
       * smoothstep(1.35, 1.75, x + z) * (1 - smoothstep(1.95, 2.35, x + z));

    // 低地小湖
    const dp2 = (x - 2.00) * (x - 2.00) + (z - 2.25) * (z - 2.25);
    h -= 0.42 * Math.exp(-dp2 * 1.7);

    // 半山雪水潭
    const dt2 = (x - 0.02) * (x - 0.02) + (z - 0.10) * (z - 0.10);
    h -= 0.55 * Math.exp(-dt2 * 8.0);

    h += 0.09 * smoothstep(3.0, 3.6, Math.max(Math.abs(x), Math.abs(z)));
    return h * 1.18;
  }
  function slopeAt(x, z) {
    const e = 0.06;
    const dx = (heightAt(x + e, z) - heightAt(x - e, z)) / (2 * e);
    const dz = (heightAt(x, z + e) - heightAt(x, z - e)) / (2 * e);
    return Math.hypot(dx, dz);
  }

  /* ================= 地形网格（顶点色） ================= */
  (function terrain() {
    const seg = LOWQ ? 96 : 150;
    const geo = new THREE.PlaneGeometry(7.2, 7.2, seg, seg);
    geo.rotateX(-Math.PI / 2);

    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      pos.setY(i, heightAt(pos.getX(i), pos.getZ(i)));
    }
    geo.computeVertexNormals();

    const nrm = geo.attributes.normal;
    const colors = new Float32Array(pos.count * 3);
    const cGrassA = new THREE.Color(0x2c6339);
    const cGrassB = new THREE.Color(0x5f9b4e);
    const cGrassC = new THREE.Color(0x94ad5e);
    const cRock = new THREE.Color(0x5e564d);
    const cRockD = new THREE.Color(0x3b3733);
    const cSnow = new THREE.Color(0xf6faff);
    const cSand = new THREE.Color(0xcdb98d);
    const tmp = new THREE.Color();

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      const ny = nrm.getY(i);
      const slope = 1 - ny;

      if (y > 2.92 + 0.22 * Math.sin(x * 5.7) * Math.cos(z * 4.9) + 0.10 * Math.sin(x * 11.0 + z * 8.0)) {
        tmp.copy(cSnow);
      } else if (y > 1.62) {
        const t = (y - 1.62) / 1.35;
        tmp.copy(cRock).lerp(cSnow, t * t * 0.92);
      } else if (y < -0.86) {
        tmp.copy(cSand).lerp(cGrassB, 0.4);
      } else {
        const n = 0.5 + 0.5 * Math.sin(x * 2.6 + z * 1.7) * Math.cos(x * 1.3 - z * 2.1);
        tmp.copy(cGrassA).lerp(cGrassB, n);
        tmp.lerp(cGrassC, smoothstep(0.6, 1.0, y) * 0.35);
      }
      if (slope > 0.34) tmp.lerp(slope > 0.55 ? cRockD : cRock, smoothstep(0.34, 0.7, slope) * 0.85);

      colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.MeshPhysicalMaterial({
      vertexColors: true, roughness: 0.93, metalness: 0.0,
      sheen: 0.18, sheenRoughness: 0.9, sheenColor: new THREE.Color(0xdcecff),
      envMapIntensity: 0.30
    });
    const mesh = new THREE.Mesh(geo, mat);
    world.add(mesh);
  })();

  /* ================= 水：雪山湖 / 小湖 / 河流 / 瀑布 ================= */
  const waterMat = new THREE.MeshPhysicalMaterial({
    color: 0x274f66, roughness: 0.18, metalness: 0.12,
    transmission: 0.0, thickness: 0.4, ior: 1.33,
    transparent: true, opacity: 0.94, envMapIntensity: 0.95
  });

  const TARN = { x: 0.02, z: 0.10, r: 0.34 };
  const POND = { x: 2.00, z: 2.25, r: 0.90 };
  TARN.y = heightAt(TARN.x, TARN.z) + 0.13;
  POND.y = heightAt(POND.x, POND.z) + 0.46;

  // 水面只在"地形低于水位"的格子里生成，避免平圆片在斜坡上一半悬空
  function waterPatch(o) {
    const N = 26, r = o.r;
    const step = (2 * r) / N;
    const verts = [], uvs = [], idx = [], inside = [];
    for (let j = 0; j <= N; j++) {
      for (let i = 0; i <= N; i++) {
        const x = o.x - r + i * step;
        const z = o.z - r + j * step;
        const d = Math.hypot(x - o.x, z - o.z);
        verts.push(x, o.y, z);
        uvs.push(i / N, j / N);
        inside.push(d <= r && heightAt(x, z) + 0.02 < o.y);
      }
    }
    for (let j = 0; j < N; j++) {
      for (let i = 0; i < N; i++) {
        const a = j * (N + 1) + i, b = a + 1, c = a + N + 1, d = c + 1;
        if (inside[a] && inside[b] && inside[c] && inside[d]) idx.push(a, c, b, b, c, d);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, waterMat);
    world.add(m);
    return m;
  }
  waterPatch(POND);   // 高山水潭取消：坡面上的平水面会在崖口挂出一片悬空水舌

  // 河床缎带
  function ribbon(points, width, yOff, mat) {
    const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], heightAt(p[0], p[1]) + yOff, p[1])));
    const N = 90, half = width / 2;
    const verts = [], uvs = [], idx = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const p = curve.getPoint(t);
      const tan = curve.getTangent(t);
      const nx = -tan.z, nz = tan.x;
      const len = Math.hypot(nx, nz) || 1;
      verts.push(p.x + nx / len * half, heightAt(p.x + nx / len * half, p.z + nz / len * half) + yOff, p.z + nz / len * half);
      verts.push(p.x - nx / len * half, heightAt(p.x - nx / len * half, p.z - nz / len * half) + yOff, p.z - nz / len * half);
      uvs.push(0, t, 1, t);
      if (i < N) {
        const a = i * 2;
        idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    return new THREE.Mesh(g, mat);
  }

  const riverMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0x2d5f74) } },
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float uTime; uniform vec3 uColor; varying vec2 vUv;
      void main(){
        float edge = smoothstep(0.0, 0.34, vUv.x) * smoothstep(1.0, 0.66, vUv.x);
        float flow = 0.5 + 0.5 * sin(vUv.y * 26.0 - uTime * 1.9 + sin(vUv.x * 7.0) * 1.1);
        vec3 c = mix(uColor, vec3(0.58, 0.75, 0.84), flow * 0.26 + 0.10);
        gl_FragColor = vec4(c, edge * (0.44 + 0.18 * flow));
      }`
  });

  // 上层河：到断崖唇口为止
  world.add(ribbon([[-0.46, 1.62], [-0.26, 1.44], [-0.04, 1.26], [0.18, 1.12], [0.40, 1.02], [0.55, 0.96], [0.60, 0.98]], 0.15, 0.035, riverMat));
  // 下层河：从瀑布脚下流进湖里
  world.add(ribbon([[1.44, 1.76], [1.58, 1.86], [1.72, 1.96], [1.86, 2.08], [1.96, 2.16]], 0.20, 0.035, riverMat));

  let sprayUniform = null;
  // 源头：雪线下的泉眼石（自带几何/材质，避免依赖后面定义的 rockGeo）
  const springGeo = new THREE.IcosahedronGeometry(0.3, 0);
  const springMat = new THREE.MeshStandardMaterial({ color: 0x6f737c, roughness: 0.95, metalness: 0.0 });
  [[-0.52, 1.68, 0.20], [-0.34, 1.48, 0.16], [-0.30, 1.56, 0.13]].forEach(([x, z, s], k) => {
    const m = new THREE.Mesh(springGeo, springMat);
    m.scale.set(s, s * 0.75, s);
    m.position.set(x + (k % 2 ? 0.12 : -0.12), heightAt(x, z) - 0.06, z + (k % 2 ? -0.10 : 0.10));
    m.rotation.set(rnd() * 0.6, rnd() * 3, rnd() * 0.6);
    world.add(m);
  });

  const waterfallMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0x9fc0d4) } },
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float uTime; uniform vec3 uColor; varying vec2 vUv;
      void main(){
        float s = fract(vUv.y * 4.0 - uTime * 1.25 + sin(vUv.x * 9.0) * 0.06);
        float streak = smoothstep(0.0, 0.20, s) * smoothstep(0.70, 0.34, s);
        float edge = smoothstep(0.0, 0.30, vUv.x) * smoothstep(1.0, 0.70, vUv.x);
        float head = smoothstep(1.0, 0.90, vUv.y);        // 顶端融进河面
        float tail = smoothstep(0.0, 0.16, vUv.y);        // 底端融进水雾
        float a = edge * head * tail * (0.46 + 0.44 * streak);
        vec3 c = mix(uColor, vec3(1.0), streak * 0.5);
        gl_FragColor = vec4(c, clamp(a, 0.0, 1.0));
      }`
  });

  // 瀑布：贴着崖面从唇口一路铺到湖面，两端都与河重叠，避免"悬空贴片"
  const FALL_PATH = [[0.56, 0.93], [0.70, 1.08], [0.86, 1.24], [1.02, 1.40], [1.18, 1.54], [1.32, 1.66], [1.44, 1.76]];
  const FALL = { x: 0.98, z: 1.32 };
  (function buildFall() {
    const N = 40;
    const curve = new THREE.CatmullRomCurve3(FALL_PATH.map(p => new THREE.Vector3(p[0], 0, p[1])));
    const verts = [], uvs = [], idx = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const p = curve.getPoint(t);
      const tan = curve.getTangent(t);
      const w = lerp(0.42, 0.66, t * t);
      const nx = -tan.z, nz = tan.x;
      const l = Math.hypot(nx, nz) || 1;
      const ox = nx / l * w * 0.5, oz = nz / l * w * 0.5;
      const lift = 0.045 + 0.05 * t;
      let yL = heightAt(p.x + ox, p.z + oz) + lift;
      let yR = heightAt(p.x - ox, p.z - oz) + lift;
      // 末端压到湖面高度，别悬在半空
      const k = smoothstep(0.72, 1.0, t);
      yL = lerp(yL, POND.y + 0.03, k);
      yR = lerp(yR, POND.y + 0.03, k);
      verts.push(p.x + ox, yL, p.z + oz, p.x - ox, yR, p.z - oz);
      uvs.push(0, t, 1, t);
      if (i < N) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    world.add(new THREE.Mesh(g, waterfallMat));

    // 外侧再罩一层柔光水雾，让水幕有体积而不是一条细线
    const sv = [];
    for (let i = 0; i < verts.length; i += 6) {
      const x1 = verts[i], y1 = verts[i + 1], z1 = verts[i + 2];
      const x2 = verts[i + 3], y2 = verts[i + 4], z2 = verts[i + 5];
      const cx = (x1 + x2) / 2, cz = (z1 + z2) / 2;
      sv.push(cx + (x1 - cx) * 2.3, y1 + 0.03, cz + (z1 - cz) * 2.3);
      sv.push(cx + (x2 - cx) * 2.3, y2 + 0.03, cz + (z2 - cz) * 2.3);
    }
    const spray = new THREE.BufferGeometry();
    spray.setAttribute('position', new THREE.Float32BufferAttribute(sv, 3));
    spray.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    spray.setIndex(idx);
    spray.computeVertexNormals();
    const sprayMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0xdbeefb) } },
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        uniform float uTime; uniform vec3 uColor; varying vec2 vUv;
        void main(){
          float n = 0.5 + 0.5 * sin(vUv.y * 11.0 - uTime * 1.1 + sin(vUv.x * 6.0) * 1.4);
          float edge = smoothstep(0.0, 0.45, vUv.x) * smoothstep(1.0, 0.55, vUv.x);
          float fade = smoothstep(0.0, 0.25, vUv.y) * smoothstep(1.0, 0.75, vUv.y);
          gl_FragColor = vec4(uColor, edge * fade * (0.10 + 0.10 * n));
        }`
    });
    world.add(new THREE.Mesh(spray, sprayMat));
    sprayUniform = sprayMat.uniforms.uTime;
  })();

  // 湖面溅水圈
  const splashRing = (() => {
    const g = new THREE.RingGeometry(0.16, 0.34, 48);
    g.rotateX(-Math.PI / 2);
    const m = new THREE.MeshBasicMaterial({
      color: 0xdff2ff, transparent: true, opacity: 0.5,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(g, m);
    mesh.position.set(1.42, POND.y + 0.012, 1.76);
    world.add(mesh);
    return mesh;
  })();

  // 瀑布水雾
  const foam = [];
  for (let i = 0; i < 9; i++) {
    const m = new THREE.SpriteMaterial({
      map: TEX_MIST, color: 0xdff2ff, transparent: true, opacity: 0.0,
      depthWrite: false, blending: THREE.NormalBlending
    });
    const sp = new THREE.Sprite(m);
    sp.position.set(1.38 + (rnd() - 0.5) * 0.5, POND.y + 0.04 + rnd() * 0.5, 1.72 + (rnd() - 0.5) * 0.5);
    const s = 0.35 + rnd() * 0.5;
    sp.scale.set(s, s, 1);
    sp.userData.phase = rnd() * Math.PI * 2;
    sp.userData.base = sp.position.clone();
    world.add(sp);
    foam.push(sp);
  }

  /* ================= 植被 / 岩石 ================= */
  const clayMat = (color, opts = {}) => new THREE.MeshPhysicalMaterial(Object.assign({
    color, roughness: 0.92, metalness: 0.0,
    sheen: 0.5, sheenRoughness: 0.9, sheenColor: new THREE.Color(0xffffff),
    envMapIntensity: 0.5
  }, opts));

  const treeTrunkMat = clayMat(0x4a3327, { sheen: 0.2 });
  const treeLeafMatA = clayMat(0x1f5030, { sheen: 0.25, roughness: 0.95 });
  const treeLeafMatB = clayMat(0x2b6438, { sheen: 0.25, roughness: 0.95 });
  const rockMat = clayMat(0x6f737c, { sheen: 0.15 });
  const bushMat = clayMat(0x417c4b);

  const treeGeoTrunk = new THREE.CylinderGeometry(0.055, 0.085, 0.5, 7);
  const treeGeoCrown = new THREE.ConeGeometry(0.36, 0.86, 9);
  const treeGeoBlob = new THREE.IcosahedronGeometry(0.3, 0);

  const rockGeo = new THREE.IcosahedronGeometry(0.3, 0);
  const bushGeo = new THREE.IcosahedronGeometry(0.18, 0);

  const riverPts = [[-0.12, -0.02], [0.12, 0.32], [0.38, 0.66], [0.74, 1.06], [1.02, 1.40], [1.44, 1.88], [1.92, 2.16]];
  function distToRiver(x, z) {
    let best = 1e9;
    for (let i = 0; i < riverPts.length - 1; i++) {
      const [x1, z1] = riverPts[i], [x2, z2] = riverPts[i + 1];
      const dx = x2 - x1, dz = z2 - z1;
      const t = clamp(((x - x1) * dx + (z - z1) * dz) / (dx * dx + dz * dz), 0, 1);
      best = Math.min(best, Math.hypot(x - (x1 + dx * t), z - (z1 + dz * t)));
    }
    return best;
  }

  // 树木：改用外部低模（松树丛 / 阔叶树），随机朝向与缩放
  function createTree(x, z, s) {
    const g = buildModel('pine', { scale: s * 0.52, tint: 0xb9c4ab });
    g.position.set(x, heightAt(x, z) - 0.04, z);
    g.rotation.y = rnd() * 6.28;
    return g;
  }
  function createBroadTree(x, z, s) {
    const g = buildModel('broadleaf', { scale: s * 0.85, tint: 0xc2cdb4 });
    g.position.set(x, heightAt(x, z) - 0.04, z);
    g.rotation.y = rnd() * 6.28;
    return g;
  }

  // 森林散布
  const forestGroup = new THREE.Group();
  world.add(forestGroup);
  let placed = 0, tries = 0;
  while (placed < 16 && tries < 900) {
    tries++;
    const x = (rnd() - 0.5) * 6.6;
    const z = (rnd() - 0.5) * 6.6;
    const y = heightAt(x, z);
    if (y < -1.30 || y > 1.55) continue;
    if (slopeAt(x, z) > 0.85) continue;
    if (Math.hypot(x - POND.x, z - POND.z) < POND.r + 0.30) continue;
    if (Math.hypot(x - TARN.x, z - TARN.z) < TARN.r + 0.28) continue;
    if (distToRiver(x, z) < 0.34) continue;
    if (Math.hypot(x - FALL.x, z - FALL.z) < 0.55) continue;
    const s = 0.85 + rnd() * 0.45;
    forestGroup.add(rnd() > 0.62 ? createBroadTree(x, z, s) : createTree(x, z, s));
    placed++;
  }

  // 灌木与石块
  for (let i = 0; i < 40; i++) {
    const x = (rnd() - 0.5) * 6.8, z = (rnd() - 0.5) * 6.8;
    const y = heightAt(x, z);
    if (y < -1.45 || y > 1.45) continue;
    if (Math.hypot(x - POND.x, z - POND.z) < POND.r + 0.12) continue;
    if (distToRiver(x, z) < 0.26) continue;
    const isRock = rnd() > 0.55;
    const m = new THREE.Mesh(isRock ? rockGeo : bushGeo, isRock ? rockMat : bushMat);
    const s = isRock ? 0.16 + rnd() * 0.32 : 0.45 + rnd() * 0.5;
    m.scale.set(s * (0.8 + rnd() * 0.6), s * (0.55 + rnd() * 0.4), s * (0.8 + rnd() * 0.6));
    m.position.set(x, y + (isRock ? 0.03 : 0.10), z);
    m.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
    world.add(m);
  }

  // 瀑布两侧的岩台
  [[FALL.x - 0.42, FALL.z + 0.42, 0.34], [FALL.x + 0.44, FALL.z - 0.44, 0.32]].forEach(([x, z, s]) => {
    const m = new THREE.Mesh(rockGeo, rockMat);
    m.scale.set(s, s * 0.7, s);
    m.position.set(x, heightAt(x, z) + 0.02, z);
    m.rotation.set(rnd() * 0.6, rnd() * 3, rnd() * 0.6);
    world.add(m);
  });

  /* ================= 摆件底座：把地形边缘垂直拉成"地块" ================= */
  (function plinth() {
    const N = 96, half = 3.6, yBot = -1.80;
    const verts = [], idx = [];
    const edgePoint = (e, t) => {
      const u = -half + 2 * half * t;
      if (e === 0) return [u, -half];
      if (e === 1) return [u, half];
      if (e === 2) return [-half, u];
      return [half, u];
    };
    let base = 0;
    for (let e = 0; e < 4; e++) {
      for (let i = 0; i <= N; i++) {
        const [x, z] = edgePoint(e, i / N);
        verts.push(x, heightAt(x, z) - 0.02, z, x, yBot, z);
      }
      for (let i = 0; i < N; i++) {
        const a = base + i * 2;
        idx.push(a, a + 1, a + 2, a + 2, a + 1, a + 3);
      }
      base += (N + 1) * 2;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    const cTop = new THREE.Color(0x6a5747), cBot = new THREE.Color(0x1e1b19);
    const col = [];
    for (let i = 0; i < verts.length; i += 3) {
      const isTop = (i / 3) % 2 === 0;
      const c = isTop ? cTop : cBot;
      col.push(c.r, c.g, c.b);
    }
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    const wallMat = new THREE.MeshPhysicalMaterial({
      vertexColors: true, roughness: 0.98, metalness: 0.0,
      envMapIntensity: 0.12, sheen: 0.05
    });
    wallMat.side = THREE.DoubleSide;
    world.add(new THREE.Mesh(g, wallMat));

    const bg = new THREE.PlaneGeometry(7.2, 7.2);
    bg.rotateX(Math.PI / 2);
    const bottom = new THREE.Mesh(bg, clayMat(0x24232a, { roughness: 1.0, envMapIntensity: 0.1 }));
    bottom.position.y = yBot;
    world.add(bottom);
  })();

  /* ================= 动物：小鹿 + 飞鸟 ================= */
  // 小鹿：外部低模（带鹿角），站在湖岸草地上
  (function deer() {
    const g = buildModel('deer', { scale: 0.80 });
    const dx = 0.30, dz = 1.74;
    g.position.set(dx, heightAt(dx, dz) - 0.01, dz);
    g.rotation.y = -2.2;
    world.add(g);
  })();

  const BIRD_UP = new THREE.Vector3(0, 1, 0);
  const BIRD_FWD = new THREE.Vector3(1, 0, 0);
  const BIRD_ROLL = new THREE.Quaternion();
  // 小羊：外部低模（带脸和腿），站在湖岸草地上
  [[1.75, 1.15, 0.44, 2.3], [1.32, 0.52, 0.41, 0.9], [2.12, 0.95, 0.38, 3.9]].forEach(([x, z, s, ry]) => {
    const g = buildModel('sheep', { scale: s, tint: 0xfff1dd });
    g.position.set(x, heightAt(x, z) - 0.01, z);
    g.rotation.y = ry;
    world.add(g);
  });

  const birds = [];
  (function createBirds() {
    for (let i = 0; i < 3; i++) {
      const g = buildEagle();
      const flapU = g.userData.flap;
      g.scale.setScalar(0.60);
      g.userData = {
        flapU, phase: i * 2.1, radius: 1.9 + i * 0.5,
        speed: 0.20 + i * 0.05, y: 3.25 + i * 0.18
      };
      world.add(g);
      birds.push(g);
    }
  })();

  /* ================= 云 / 雾 / 萤火 / 光柱 ================= */
  const cloudMat = new THREE.MeshPhysicalMaterial({
    color: 0xf2f7ff, roughness: 1.0, metalness: 0,
    sheen: 1.0, sheenRoughness: 1.0, sheenColor: new THREE.Color(0xffffff),
    transparent: true, opacity: 0.42, envMapIntensity: 0.3, depthWrite: false
  });
  const cloudGeo = new THREE.SphereGeometry(1, 12, 10);
  const clouds = [];
  [[-2.3, 3.05, -0.7, 1.0], [1.5, 3.20, 0.5, 0.85], [-0.4, 3.45, -1.8, 0.72], [2.4, 2.80, 1.7, 0.6]].forEach(([x, y, z, sc]) => {
    const g = new THREE.Group();
    for (let i = 0; i < 5; i++) {
      const sph = new THREE.Mesh(cloudGeo, cloudMat);
      const s = 0.24 + rnd() * 0.30;
      sph.scale.set(s, s * 0.8, s);
      sph.position.set((rnd() - 0.5) * 0.8, (rnd() - 0.5) * 0.26, (rnd() - 0.5) * 0.8);
      g.add(sph);
    }
    g.position.set(x, y, z);
    g.scale.setScalar(sc);
    world.add(g);
    g.userData = { base: g.position.clone(), phase: rnd() * 6.28 };
    clouds.push(g);
  });

  // 地表薄雾
  const mists = [];
  for (let i = 0; i < 5; i++) {
    const m = new THREE.SpriteMaterial({
      map: TEX_MIST, color: 0xcfe2ff, transparent: true, opacity: 0.06,
      depthWrite: false, blending: THREE.NormalBlending
    });
    const sp = new THREE.Sprite(m);
    const y = -0.95 + rnd() * 0.55;
    sp.position.set((rnd() - 0.5) * 5.0, y, (rnd() - 0.5) * 5.0);
    const s = 1.1 + rnd() * 1.2;
    sp.scale.set(s, s * 0.55, 1);
    sp.userData = { base: sp.position.clone(), phase: rnd() * 6.28, amp: 0.10 + rnd() * 0.12 };
    world.add(sp);
    mists.push(sp);
  }

  // 萤火 / 尘埃
  const fireflyMat = new THREE.PointsMaterial({
    map: TEX_GLOW, color: 0xffe2a6, size: 0.22, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
  });
  const fireflies = (() => {
    const count = 130;
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const x = (rnd() - 0.5) * 6.5, z = (rnd() - 0.5) * 6.5;
      pos[i * 3] = x;
      pos[i * 3 + 1] = heightAt(x, z) + 0.15 + rnd() * 1.9;
      pos[i * 3 + 2] = z;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const p = new THREE.Points(g, fireflyMat);
    world.add(p);
    return g;
  })();

  // 光柱：斜射入盒内的体积光
  const beamMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 }, uColor: { value: new THREE.Color(0xffe8c0) }, uOpacity: { value: 0.0 }
    },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float uTime; uniform float uOpacity; uniform vec3 uColor; varying vec2 vUv;
      void main(){
        float edge = smoothstep(0.0, 0.30, vUv.x) * smoothstep(1.0, 0.70, vUv.x);
        float len = smoothstep(1.0, 0.10, vUv.y) * smoothstep(0.0, 0.06, vUv.y);
        float wob = 0.82 + 0.18 * sin(vUv.y * 5.0 + uTime * 1.1 + vUv.x * 4.0);
        gl_FragColor = vec4(uColor, edge * len * wob * uOpacity);
      }`
  });
  const beams = [];
  // 体积光改为屏幕空间径向光束（见合成着色器 uGod），盒内不再放实体光柱片

  /* ================= 玻璃立方体 ================= */
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xdcefff, metalness: 0.0, roughness: 0.06, ior: 1.5,
    transparent: true, opacity: 0.028, envMapIntensity: 0.55,
    depthWrite: false, side: THREE.FrontSide
  });
  const glassGeo = new THREE.BoxGeometry(BOX, BOX, BOX);
  const glassMesh = new THREE.Mesh(glassGeo, glassMat);
  glassMesh.renderOrder = 4;
  glassGroup.add(glassMesh);

  // 边缘菲涅尔微光壳
  const fresnelMat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(0xa8d4ff) },
      uPower: { value: 8.5 }, uIntensity: { value: 0.75 }, uTime: { value: 0 }
    },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.FrontSide,
    vertexShader: `
      varying vec3 vN; varying vec3 vW;
      void main(){
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vW = wp.xyz;
        vN = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      uniform vec3 uColor; uniform float uPower, uIntensity, uTime;
      varying vec3 vN; varying vec3 vW;
      void main(){
        vec3 V = normalize(cameraPosition - vW);
        float f = pow(1.0 - clamp(abs(dot(normalize(vN), V)), 0.0, 1.0), uPower);
        float pulse = 0.88 + 0.12 * sin(uTime * 0.8);
        gl_FragColor = vec4(uColor * f * uIntensity * pulse, 1.0);
      }`
  });
  const fresnelShell = new THREE.Mesh(new THREE.BoxGeometry(BOX * 1.004, BOX * 1.004, BOX * 1.004), fresnelMat);
  fresnelShell.renderOrder = 5;
  glassGroup.add(fresnelShell);

  const edgeGeo = new THREE.EdgesGeometry(glassGeo, 20);
  const edgeMat = new THREE.LineBasicMaterial({ color: 0xdcefff, transparent: true, opacity: 0.55 });
  const edgeLines = new THREE.LineSegments(edgeGeo, edgeMat);
  edgeLines.renderOrder = 6;
  glassGroup.add(edgeLines);

  // 底座阴影/反光（摆件感）
  const baseGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX_SOFT, color: 0x6fa8ff, transparent: true, opacity: 0.12,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  baseGlow.scale.set(13, 7, 1);
  baseGlow.position.set(0, -BOX / 2 - 0.5, 0);
  glassGroup.add(baseGlow);

  /* ================= 灯光 & 昼夜 ================= */
  const hemi = new THREE.HemisphereLight(0x9fc4ff, 0x2a2620, 0.6);
  scene.add(hemi);

  const sunLight = new THREE.DirectionalLight(0xfff0d8, 2.4);
  sunLight.position.set(9, 12, 6);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  sunLight.shadow.camera.left = -6.5;
  sunLight.shadow.camera.right = 6.5;
  sunLight.shadow.camera.top = 6.5;
  sunLight.shadow.camera.bottom = -6.5;
  sunLight.shadow.camera.near = 1;
  sunLight.shadow.camera.far = 46;
  sunLight.shadow.bias = -0.0006;
  sunLight.shadow.normalBias = 0.03;
  scene.add(sunLight);

  const moonLight = new THREE.DirectionalLight(0xa9bcff, 0.9);
  moonLight.position.set(-9, 9, -5);
  scene.add(moonLight);

  const rimLight = new THREE.PointLight(0xffcf9a, 10, 26, 2);
  rimLight.position.set(-6, 5.5, 4.5);
  scene.add(rimLight);

  // 跟随相机的柔和补光，避免正面发死
  const fillLight = new THREE.DirectionalLight(0xc7dcff, 0.4);
  fillLight.position.set(8, 6, 10);
  scene.add(fillLight);

  const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX_GLOW, color: 0xffe6b8, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  sunSprite.scale.set(10, 10, 1);
  scene.add(sunSprite);

  /* ================= 相机控制 ================= */
  const orbit = (() => {
    const target = new THREE.Vector3(0, 0.15, 0);
    const el = renderer.domElement;
    const s = {
      r: Q.has('r') ? parseFloat(Q.get('r')) : 24,
      th: Q.has('th') ? parseFloat(Q.get('th')) : 0.74,
      ph: Q.has('ph') ? parseFloat(Q.get('ph')) : 1.14,
      tr: 24, tth: 0.74, tph: 1.14,
      drag: false, lx: 0, ly: 0, pinch: 0
    };
    s.tr = s.r; s.tth = s.th; s.tph = s.ph;
    const clampPh = v => clamp(v, 0.30, 2.35);
    const clampR = v => clamp(v, 13, 40);

    el.style.cursor = 'grab';
    el.addEventListener('pointerdown', e => {
      s.drag = true; s.lx = e.clientX; s.ly = e.clientY;
      el.setPointerCapture(e.pointerId); el.style.cursor = 'grabbing';
    });
    el.addEventListener('pointermove', e => {
      if (!s.drag) return;
      s.tth -= (e.clientX - s.lx) * 0.0055;
      s.tph = clampPh(s.tph - (e.clientY - s.ly) * 0.0045);
      s.lx = e.clientX; s.ly = e.clientY;
    });
    const endFn = e => {
      s.drag = false; el.style.cursor = 'grab';
      if (e && e.pointerId !== undefined && el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
    };
    el.addEventListener('pointerup', endFn);
    el.addEventListener('pointercancel', endFn);
    el.addEventListener('wheel', e => {
      e.preventDefault();
      s.tr = clampR(s.tr * Math.exp(e.deltaY * 0.0011));
    }, { passive: false });
    el.addEventListener('touchmove', e => {
      if (e.touches.length !== 2) return;
      e.preventDefault();
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (s.pinch) s.tr = clampR(s.tr * (s.pinch / d));
      s.pinch = d;
    }, { passive: false });
    el.addEventListener('touchend', () => { s.pinch = 0; });

    return {
      state: s,
      update(dt) {
        s.r += (s.tr - s.r) * Math.min(1, dt * 9);
        s.th += (s.tth - s.th) * Math.min(1, dt * 9);
        s.ph += (s.tph - s.ph) * Math.min(1, dt * 9);
        const sp = Math.sin(s.ph);
        camera.position.set(
          target.x + s.r * sp * Math.sin(s.th),
          target.y + s.r * Math.cos(s.ph),
          target.z + s.r * sp * Math.cos(s.th)
        );
        camera.lookAt(target);
      }
    };
  })();

  /* ================= 后期：HDR → Bloom → 移轴模糊 → 合成 ================= */
  const FS_VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
  const fsGeo = new THREE.PlaneGeometry(2, 2);
  const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const fsMesh = new THREE.Mesh(fsGeo, null);
  const fsScene = new THREE.Scene();
  fsScene.add(fsMesh);
  fsMesh.frustumCulled = false;

  const brightMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null }, uThreshold: { value: 0.85 }, uKnee: { value: 0.55 } },
    vertexShader: FS_VERT,
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform float uThreshold, uKnee; varying vec2 vUv;
      void main(){
        vec3 c = texture2D(tDiffuse, vUv).rgb;
        float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
        float k = smoothstep(uThreshold, uThreshold + uKnee, l);
        gl_FragColor = vec4(c * k, 1.0);
      }`,
    depthTest: false, depthWrite: false
  });

  const blurMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2() } },
    vertexShader: FS_VERT,
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform vec2 uDir; varying vec2 vUv;
      void main(){
        vec3 sum = vec3(0.0);
        float wsum = 0.0;
        for (int i = -6; i <= 6; i++) {
          float fi = float(i);
          float w = exp(-fi * fi / 18.0);
          sum += texture2D(tDiffuse, vUv + uDir * fi).rgb * w;
          wsum += w;
        }
        gl_FragColor = vec4(sum / wsum, 1.0);
      }`,
    depthTest: false, depthWrite: false
  });

  const copyMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null } },
    vertexShader: FS_VERT,
    fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
      void main(){ gl_FragColor = vec4(texture2D(tDiffuse, vUv).rgb, 1.0); }`,
    depthTest: false, depthWrite: false
  });

  const compMat = new THREE.ShaderMaterial({
    uniforms: {
      tScene: { value: null }, tTilt: { value: null },
      tBloomA: { value: null }, tBloomB: { value: null },
      uRes: { value: new THREE.Vector2(1, 1) },
      uTime: { value: 0 },
      uExposure: { value: 1.0 },
      uBloom: { value: 0.55 },
      uTilt: { value: 0.55 },
      uBand: { value: 0.19 },
      uFeather: { value: 0.28 },
      uVignette: { value: 0.62 },
      uGrain: { value: 0.007 },
      uSat: { value: 1.1 },
      uWarm: { value: 0.0 },
      uSun: { value: new THREE.Vector2(0.5, 0.5) },
      uDbg: { value: Q.has('dbg') ? 1.0 : 0.0 },
      uGod: { value: 0.0 }
    },
    vertexShader: FS_VERT,
    fragmentShader: `
      uniform sampler2D tScene, tTilt, tBloomA, tBloomB;
      uniform vec2 uRes; uniform vec2 uSun;
      uniform float uTime, uExposure, uBloom, uTilt, uBand, uFeather, uVignette, uGrain, uSat, uWarm, uGod, uDbg;
      varying vec2 vUv;

      vec3 aces(vec3 x){
        const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
        return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
      }
      vec3 toSRGB(vec3 c){
        vec3 lo = c * 12.92;
        vec3 hi = 1.055 * pow(max(c, vec3(0.0)), vec3(1.0 / 2.4)) - 0.055;
        return mix(lo, hi, step(vec3(0.0031308), c));
      }
      void main(){
        vec2 uv = vUv;
        if (uDbg > 0.5) {
          vec3 raw = texture2D(tScene, uv).rgb * uExposure;
          gl_FragColor = vec4(toSRGB(clamp(raw, 0.0, 1.0)), 1.0);
          return;
        }
        vec2 p = uv - 0.5;

        float ang = -0.13;
        vec2 rp = vec2(p.x * cos(ang) - p.y * sin(ang), p.x * sin(ang) + p.y * cos(ang));
        float d = abs(rp.y);
        float m = smoothstep(uBand, uBand + uFeather, d) * uTilt;

        vec3 sharp = texture2D(tScene, uv).rgb;
        vec3 soft = texture2D(tTilt, uv).rgb;
        vec3 col = mix(sharp, soft, m);

        float ca = 0.0004 * m;
        col.r = mix(col.r, texture2D(tScene, uv + vec2(ca, 0.0)).r, 0.5 * m);
        col.b = mix(col.b, texture2D(tScene, uv - vec2(ca, 0.0)).b, 0.5 * m);

        vec3 bloom = texture2D(tBloomA, uv).rgb + texture2D(tBloomB, uv).rgb * 1.15;
        col += bloom * uBloom;

        // 体积光：从太阳/月亮位置向外拉出径向光束
        if (uGod > 0.001) {
          vec2 toSun = uSun - uv;
          float dS = length(toSun);
          vec3 ray = vec3(0.0);
          float wsum = 0.0;
          for (int i = 1; i <= 14; i++) {
            float tt = float(i) / 14.0;
            vec2 suv = uv + toSun * tt * 0.9;
            float w = 1.0 - tt * 0.85;
            ray += texture2D(tBloomB, clamp(suv, 0.001, 0.999)).rgb * w;
            wsum += w;
          }
          ray /= max(wsum, 0.0001);
          col += ray * uGod * smoothstep(1.25, 0.12, dS) * 1.6;
        }

        col *= uExposure;
        col = aces(col);
        col *= vec3(1.0 + uWarm * 0.06, 1.0, 1.0 - uWarm * 0.05);

        float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
        col = mix(vec3(lum), col, uSat);

        float vig = 1.0 - uVignette * pow(length(p * 1.28), 2.1);
        col *= clamp(vig, 0.0, 1.0);

        float g = fract(sin(dot(uv * uRes + uTime * 37.0, vec2(12.9898, 78.233))) * 43758.5453);
        col += (g - 0.5) * uGrain;

        gl_FragColor = vec4(toSRGB(col), 1.0);
      }`,
    depthTest: false, depthWrite: false
  });

  const RT = {};
  function makeRT(w, h) {
    return new THREE.WebGLRenderTarget(w, h, {
      type: THREE.HalfFloatType,
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      depthBuffer: true,
      samples: LOWQ ? 0 : 4
    });
  }

  function buildTargets() {
    const w = Math.max(2, Math.floor(innerWidth * DPR));
    const h = Math.max(2, Math.floor(innerHeight * DPR));
    Object.keys(RT).forEach(k => RT[k].dispose());
    RT.scene = makeRT(w, h);
    RT.bright = makeRT(w >> 1, h >> 1);
    RT.blurA = makeRT(w >> 1, h >> 1);
    RT.blurB = makeRT(w >> 1, h >> 1);
    RT.blurC = makeRT(w >> 2, h >> 2);
    RT.blurD = makeRT(w >> 2, h >> 2);
    RT.tiltA = makeRT(w >> 1, h >> 1);
    RT.tiltB = makeRT(w >> 1, h >> 1);
    compMat.uniforms.uRes.value.set(w, h);
  }

  function pass(mat, target) {
    fsMesh.material = mat;
    renderer.setRenderTarget(target);
    renderer.render(fsScene, fsCam);
  }

  function renderFrame() {
    // 1) 场景 → HDR
    renderer.setRenderTarget(RT.scene);
    renderer.clear();
    renderer.render(scene, camera);

    // 2) 亮部提取（1/2）
    brightMat.uniforms.tDiffuse.value = RT.scene.texture;
    pass(brightMat, RT.bright);

    // 3) 泛光链
    blurMat.uniforms.tDiffuse.value = RT.bright.texture;
    blurMat.uniforms.uDir.value.set(1.4 / (RT.bright.width), 0);
    pass(blurMat, RT.blurA);

    blurMat.uniforms.tDiffuse.value = RT.blurA.texture;
    blurMat.uniforms.uDir.value.set(0, 1.4 / (RT.blurA.height));
    pass(blurMat, RT.blurB);

    // 4) 更宽的一层（1/4）
    copyMat.uniforms.tDiffuse.value = RT.blurB.texture;
    pass(copyMat, RT.blurC);

    blurMat.uniforms.tDiffuse.value = RT.blurC.texture;
    blurMat.uniforms.uDir.value.set(2.2 / RT.blurC.width, 0);
    pass(blurMat, RT.blurD);

    blurMat.uniforms.tDiffuse.value = RT.blurD.texture;
    blurMat.uniforms.uDir.value.set(0, 2.2 / RT.blurD.height);
    pass(blurMat, RT.blurC);

    // 5) 移轴虚化（1/2）
    copyMat.uniforms.tDiffuse.value = RT.scene.texture;
    pass(copyMat, RT.tiltA);

    blurMat.uniforms.tDiffuse.value = RT.tiltA.texture;
    blurMat.uniforms.uDir.value.set(1.3 / RT.tiltA.width, 0);
    pass(blurMat, RT.tiltB);

    blurMat.uniforms.tDiffuse.value = RT.tiltB.texture;
    blurMat.uniforms.uDir.value.set(0, 1.3 / RT.tiltB.height);
    pass(blurMat, RT.tiltA);

    // 6) 合成 → 屏幕
    compMat.uniforms.tScene.value = RT.scene.texture;
    compMat.uniforms.tTilt.value = RT.tiltA.texture;
    compMat.uniforms.tBloomA.value = RT.blurB.texture;
    compMat.uniforms.tBloomB.value = RT.blurC.texture;
    pass(compMat, null);
  }

  /* ================= 昼夜 & 动画 ================= */
  const clock = new THREE.Clock();
  const DAY_SEC = 46;
  let firstFrame = true;

  const sunDir = new THREE.Vector3();

  function animate() {
    const dtRaw = clock.getDelta();
    const dt = Math.min(0.05, dtRaw || 0.016);
    const t = FREEZE !== null ? FREEZE : clock.elapsedTime;

    orbit.update(dt);

    const cycle = (t % DAY_SEC) / DAY_SEC;
    const ang = cycle * Math.PI * 2 - Math.PI / 2;   // 太阳高度角用的相位
    const elev = Math.sin(ang);
    const day = smoothstep(-0.10, 0.42, elev);        // 0 夜 1 昼
    const night = 1 - day;

    sunLight.position.set(Math.cos(ang) * 10, elev * 11 + 2.2, 7.5);
    sunLight.intensity = 0.20 + day * 5.4;
    sunDir.copy(sunLight.position).normalize();

    moonLight.intensity = night * 1.55;
    hemi.intensity = Q.has('dark') ? 0.0 : (0.08 + day * 0.10);
    fillLight.position.copy(camera.position);
    fillLight.intensity = Q.has('dark') ? 0.0 : (0.16 + day * 0.22);
    rimLight.intensity = 5 + night * 16;
    rimLight.color.setHSL(lerp(0.09, 0.55, night), 0.6, 0.55);

    sunSprite.position.copy(sunLight.position).multiplyScalar(6.5);
    sunSprite.material.opacity = day * 0.5;
    sunSprite.material.color.setHSL(0.09, 0.55, lerp(0.62, 0.78, day));

    // 屏幕空间体积光的太阳位置
    camera.updateMatrixWorld();
    const sunNdc = sunLight.position.clone().normalize().multiplyScalar(36).project(camera);
    const sunUv = compMat.uniforms.uSun.value;
    sunUv.set(sunNdc.x * 0.5 + 0.5, sunNdc.y * 0.5 + 0.5);
    compMat.uniforms.uGod.value = day * 0.55;

    scene.background.copy(NIGHT_SKY).lerp(DAY_SKY, day * 0.9);
    scene.fog.color.copy(scene.background);
    scene.environment = envTex;

    // 背景
    if (bgGroup.userData.starMat) {
      bgGroup.userData.starMat.uniforms.uTime.value = t;
      bgGroup.userData.starMat.uniforms.uOpacity.value = 0.55 + night * 0.65;
    }
    nebulaSprites.forEach((m, i) => { m.opacity = (0.13 + i * 0.02) + night * 0.14; });
    bokehSprites.forEach((sp, i) => {
      const b = sp.material;
      b.opacity = (0.03 + (i % 5) * 0.012) * (0.5 + night * 0.8);
      sp.position.y = sp.userData.base.y + Math.sin(t * 0.12 + i) * 0.12;
    });

    // 玻璃
    fresnelMat.uniforms.uTime.value = t;
    fresnelMat.uniforms.uIntensity.value = 0.55 + night * 0.75;
    edgeMat.opacity = 0.35 + night * 0.35;
    glassMat.envMapIntensity = 0.75 + night * 0.55;
    baseGlow.material.opacity = 0.05 + night * 0.10;

    // 云 / 雾 / 精灵
    clouds.forEach((c, i) => {
      const u = c.userData;
      c.position.x = u.base.x + Math.sin(t * 0.10 + u.phase) * 0.20;
      c.position.z = u.base.z + Math.cos(t * 0.08 + u.phase * 1.7) * 0.16;
      c.position.y = u.base.y + Math.sin(t * 0.17 + u.phase * 2.3) * 0.09;
      c.rotation.y = t * 0.012 + i;
    });
    mists.forEach((sp, i) => {
      const u = sp.userData;
      sp.position.x = u.base.x + Math.sin(t * 0.10 + u.phase) * u.amp * 2.0;
      sp.position.z = u.base.z + Math.cos(t * 0.07 + u.phase) * u.amp;
      sp.material.opacity = (0.10 + 0.10 * Math.sin(t * 0.3 + u.phase)) * (0.7 + night * 0.6);
    });
    foam.forEach((sp, i) => {
      const u = sp.userData;
      const k = (t * 0.55 + i * 0.37) % 1;
      sp.position.set(u.base.x + Math.sin(i * 3.1 + t) * 0.06, u.base.y + k * 0.34, u.base.z + Math.cos(i * 2.3 + t) * 0.06);
      sp.material.opacity = 0.16 * (1 - k) * (0.8 + 0.4 * Math.sin(t * 2 + i));
      sp.scale.setScalar(0.28 + k * 0.55);
    });

    // 萤火
    const fp = fireflies.attributes.position;
    for (let i = 0; i < fp.count; i++) {
      const x = fp.getX(i), y = fp.getY(i), z = fp.getZ(i);
      fp.setY(i, y + Math.sin(t * 0.9 + i * 1.7) * 0.00085);
      fp.setX(i, x + Math.cos(t * 0.6 + i * 0.9) * 0.0006);
      fp.setZ(i, z + Math.sin(t * 0.5 + i * 1.3) * 0.0006);
    }
    fp.needsUpdate = true;
    fireflyMat.opacity = night * 0.85;

    // 体积光
    beamMat.uniforms.uTime.value = t;
    beamMat.uniforms.uOpacity.value = (0.05 + day * 0.16);
    beams.forEach((b, i) => { b.material = beamMat; b.rotation.y = 0.32 + i * 0.24 + Math.sin(t * 0.05 + i) * 0.03; });

    // 瀑布 & 飞鸟
    waterfallMat.uniforms.uTime.value = t;
    if (sprayUniform) sprayUniform.value = t;
    riverMat.uniforms.uTime.value = t;
    splashRing.material.opacity = 0.26 + 0.20 * Math.sin(t * 2.6);
    splashRing.scale.setScalar(1.0 + 0.10 * Math.sin(t * 2.6 + 1.0));

    birds.forEach((b, i) => {
      const u = b.userData;
      const a = t * u.speed + u.phase;
      b.position.set(Math.cos(a) * u.radius, u.y + Math.sin(t * 0.7 + i) * 0.12, Math.sin(a) * u.radius);
      // 鸟头朝局部 +X；速度方向 = (-sin a, 0, cos a)，据此求偏航
      const yaw = Math.atan2(-Math.cos(a), -Math.sin(a));
      b.quaternion.setFromAxisAngle(BIRD_UP, yaw).multiply(
        BIRD_ROLL.setFromAxisAngle(BIRD_FWD, 0.36)          // 向圆心侧倾
      );
      u.flapU.value = Math.sin(t * 6.0 + i * 2.1) * 0.55;
    });

    // 呼吸
    glassGroup.position.y = 0.15 + Math.sin(t * 0.5) * 0.10;
    glassGroup.rotation.y = Math.sin(t * 0.08) * 0.05;
    glassGroup.rotation.z = Math.sin(t * 0.06 + 1.0) * 0.012;

    // 合成参数
    const cu = compMat.uniforms;
    cu.uTime.value = t;
    cu.uExposure.value = (Q.has('exp') ? parseFloat(Q.get('exp')) : lerp(1.05, 0.66, day));
    cu.uBloom.value = Q.has('nobloom') ? 0.0 : lerp(0.62, 0.30, day);
    cu.uSat.value = lerp(1.24, 1.12, day);
    cu.uWarm.value = night;
    cu.uTilt.value = 0.55;

    if (firstFrame) { firstFrame = false; renderer.domElement.classList.add('ready'); }
    if (RAW) { renderer.setRenderTarget(null); renderer.render(scene, camera); return; }
    renderFrame();

    if (firstFrame) {
      firstFrame = false;
      renderer.domElement.classList.add('ready');
    }
  }

  buildTargets();
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    buildTargets();
  });

  world.traverse(o => {
    if (o.isMesh && o.material && !o.material.transparent && o.material.blending !== THREE.AdditiveBlending) {
      o.castShadow = true;
      o.receiveShadow = true;
    }
  });

  if (Q.has('nosheen')) world.traverse(o => { if (o.material && 'sheen' in o.material) o.material.sheen = 0; });
  if (Q.has('noenv')) scene.environment = null;

  renderer.setAnimationLoop(animate);
})();
</script>
</body>
</html>
