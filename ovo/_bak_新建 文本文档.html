<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>深空微缩生态立方 · 3D Diorama</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  overflow:hidden;
  background:#050510;
  font-family:system-ui, sans-serif;
  color:#fff;
}
#container{
  width:100vw;
  height:100vh;
}
.ui-hint{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  font-size:13px;
  opacity:0.65;
  pointer-events:none;
  text-align:center;
}
</style>
</head>
<body>
<div id="container"></div>
<div class="ui-hint">🖱️ 拖拽旋转 · 滚轮缩放 | 昼夜自动循环</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/shaders/FocusShader.js"></script>

<script>
(()=>{
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070718);
scene.fog = new THREE.FogExp2(0x070718, 0.07);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 220);
camera.position.set(14,12,14);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById('container').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=0.04;
controls.minDistance=7; controls.maxDistance=32;
controls.maxPolarAngle = Math.PI *0.84;

// Post: Bloom + 移轴微距景深模拟
const composer = new THREE.EffectComposer(renderer);
const renderPass = new THREE.RenderPass(scene,camera);
composer.addPass(renderPass);

const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.35,0.42,0.07);
composer.addPass(bloomPass);

// 星空背景粒子
function createStarfield(){
  const geo = new THREE.BufferGeometry();
  const count=2200;
  const pos = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    pos[i*3] = (Math.random()-0.5)*220;
    pos[i*3+1] = (Math.random()-0.5)*220;
    pos[i*3+2] = (Math.random()-0.5)*220;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({color:0xffffff,size:0.28,transparent:true,opacity:0.75,sizeAttenuation:true});
  const stars = new THREE.Points(geo,mat);
  scene.add(stars);
}
createStarfield();

// ========= 透明玻璃立方体外壳 =========
const glassGroup = new THREE.Group();
const boxSize = 8.2;
const glassGeo = new THREE.BoxGeometry(boxSize,boxSize,boxSize);
const glassMat = new THREE.MeshPhysicalMaterial({
  color:0xffffff,
  metalness:0.0,
  roughness:0.02,
  transmission:0.92,
  thickness:0.45,
  ior:1.48,
  envMapIntensity:1.0,
  side:THREE.DoubleSide
});
const glassCube = new THREE.Mesh(glassGeo, glassMat);
glassGroup.add(glassCube);

// 玻璃高亮边框（菲涅尔边缘光）
const edgeGeo = new THREE.EdgesGeometry(glassGeo,12);
const edgeMat = new THREE.LineBasicMaterial({color:0xcfe8ff,transparent:true,opacity:0.72});
const edges = new THREE.LineSegments(edgeGeo, edgeMat);
glassGroup.add(edges);
glassGroup.position.y = 0.2;
scene.add(glassGroup);

// ========= 盒内世界容器 =========
const worldContainer = new THREE.Group();
worldContainer.position.y = -boxSize/2 +0.45;
glassGroup.add(worldContainer);

// 地形生成：简易微缩地貌（山丘、雪山高地、河床凹陷）
function createTerrain(){
  const size=7.2;
  const seg=48;
  const geo = new THREE.PlaneGeometry(size,size,seg,seg);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i);
    const z = pos.getZ(i);
    let h = 0;
    // 多层噪声模拟地貌
    h += Math.sin(x*0.72)*Math.cos(z*0.72)*1.15;
    h += Math.sin(x*1.4+1.2)*Math.cos(z*1.35)*0.45;
    // 中央高地雪山
    const dHill = Math.sqrt(x*x+z*z);
    if(dHill<2.4){
      h += (2.4-dHill)*1.6;
    }
    // 蜿蜒河道凹陷
    const river = Math.sin(z*1.8)*0.75;
    const distRiver = Math.abs(x-river);
    if(distRiver<0.42) h -= 0.65*(0.42‑distRiver);
    pos.setY(i, Math.max(-0.75, h));
  }
  geo.computeVertexNormals();

  // 草地黏土质感材质
  const matGrass = new THREE.MeshStandardMaterial({
    color:0x77b868,
    roughness:0.82,
    metalness:0.02
  });
  const terrain = new THREE.Mesh(geo, matGrass);
  worldContainer.add(terrain);

  // 积雪山顶
  const snowGeo = geo.clone();
  const snowPos = snowGeo.attributes.position;
  for(let i=0;i<snowPos.count;i++){
    const y = snowPos.getY(i);
    snowPos.setY(i, y>1.15 ? y : -10);
  }
  snowGeo.computeVertexNormals();
  const snowMat = new THREE.MeshStandardMaterial({color:0xf8fcff,roughness:0.72});
  const snowMesh = new THREE.Mesh(snowGeo, snowMat);
  worldContainer.add(snowMesh);

  // 小湖泊（河道低洼）
  const lakeGeo = new THREE.CircleGeometry(1.35,32);
  lakeGeo.rotateX(-Math.PI/2);
  const lakeMat = new THREE.MeshPhysicalMaterial({
    color:0x4a90c2,
    metalness:0.0,
    roughness:0.04,
    transmission:0.78,
    ior:1.33
  });
  const lake = new THREE.Mesh(lakeGeo,lakeMat);
  lake.position.set(1.1,-0.62,-1.4);
  worldContainer.add(lake);

  return terrain;
}
createTerrain();

// 简易树（黏土风格松树）
function createTree(x,z,scale=1.0){
  const g = new THREE.Group();
  const trunkGeo = new THREE.CylinderGeometry(0.07*scale,0.11*scale,0.65*scale,8);
  const trunkMat = new THREE.MeshStandardMaterial({color:0x6b4c38,roughness:0.9});
  const trunk = new THREE.Mesh(trunkGeo,trunkMat);
  trunk.position.y=0.32*scale;
  g.add(trunk);

  const crownGeo = new THREE.ConeGeometry(0.48*scale,1.1*scale,10);
  const crownMat = new THREE.MeshStandardMaterial({color:0x397a48,roughness:0.84});
  for(let ly=0;ly<3;ly++){
    const crown = new THREE.Mesh(crownGeo,crownMat);
    crown.scale.setScalar(1‑ly*0.28);
    crown.position.y = (0.72+ly*0.42)*scale;
    g.add(crown);
  }
  g.position.set(x,0,z);
  return g;
}
// 批量森林散布
const treePositions = [
[-2.8,‑2.2],[‑2.1,‑0.6],[‑3.0,1.2],[-1.2,2.4],[0.4,2.1],
[2.6,‑1.8],[2.2,0.6],[1.4,2.6],[-0.4,‑2.6],[2.8,2.2]
];
treePositions.forEach(([px,pz])=>{
  const t = createTree(px,pz, 0.65+Math.random()*0.45);
  worldContainer.add(t);
});

// 瀑布简单面片
function createWaterfall(){
  const g=new THREE.Group();
  const fallGeo = new THREE.PlaneGeometry(0.75,1.9,8,8);
  const fallMat = new THREE.MeshPhysicalMaterial({
    color:0xc6e4ff,
    transparent:true,opacity:0.62,
    transmission:0.82,
    side:THREE.DoubleSide
  });
  const fall = new THREE.Mesh(fallGeo,fallMat);
  fall.rotation.y=Math.PI/2;
  fall.position.set(-1.6,0.4,0.2);
  g.add(fall);
  worldContainer.add(g);
  return g;
}
createWaterfall();

// 微型动物：简单小鹿
function createDeer(x,z){
  const g = new THREE.Group();
  const bodyGeo = new THREE.CapsuleGeometry(0.14,0.32,4,8);
  const mat = new THREE.MeshStandardMaterial({color:0xc9946c,roughness:0.88});
  const body = new THREE.Mesh(bodyGeo,mat);
  body.rotation.z=Math.PI/2;
  body.position.y=0.24;
  g.add(body);
  const headGeo = new THREE.SphereGeometry(0.11,8,8);
  const head = new THREE.Mesh(headGeo,mat);
  head.position.set(0.28,0.34,0);
  g.add(head);
  g.position.set(x,0.08,z);
  return g;
}
const deer = createDeer(1.8,‑0.8);
worldContainer.add(deer);

// 漂浮云朵（半透明黏土云）
function createCloud(x,y,z,scale=1){
  const g = new THREE.Group();
  const cloudMat = new THREE.MeshStandardMaterial({
    color:0xffffff,transparent:true,opacity:0.58,roughness:1.0
  });
  for(let i=0;i<5;i++){
    const s = 0.22 + Math.random()*0.32;
    const sph = new THREE.Mesh(new THREE.SphereGeometry(s,8,8), cloudMat);
    sph.position.set((Math.random()-0.5)*0.75,(Math.random()-0.5)*0.35,(Math.random()-0.5)*0.75);
    g.add(sph);
  }
  g.scale.setScalar(scale);
  g.position.set(x,y,z);
  return g;
}
const clouds = [];
[[‑2.2,2.8,‑1.0],[1.8,3.1,1.2],[0.0,3.3,‑2.0]].forEach(([x,y,z])=>{
  const c = createCloud(x,y,z, 0.85+Math.random()*0.45);
  worldContainer.add(c);
  clouds.push(c);
});

// ========= 灯光系统：昼夜循环 =========
const sunLight = new THREE.DirectionalLight(0xfff8e8, 1.4);
sunLight.position.set(8,12,6);
scene.add(sunLight);

const moonLight = new THREE.DirectionalLight(0xb8c8ff, 0.0);
moonLight.position.set(-8,9,‑4);
scene.add(moonLight);

const ambient = new THREE.AmbientLight(0x404860,0.28);
scene.add(ambient);

// 体积光模拟：点光源轮廓高光
const rimLight = new THREE.PointLight(0xffe9cb,0.75,16);
rimLight.position.set(-6,7,5);
scene.add(rimLight);

const dayCycleSec = 32;
let clock = new THREE.Clock();

function resize(){
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resize);

// 动画循环
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const cycle = (t % dayCycleSec)/dayCycleSec;
  const sunAngle = cycle * Math.PI*2;

  // 昼夜切换光源强度
  const sunInt = Math.max(0, Math.cos(sunAngle));
  const moonInt = Math.max(0,‑Math.cos(sunAngle));
  sunLight.intensity = sunInt *1.4;
  moonLight.intensity = moonInt *0.85;
  bloomPass.strength = 0.45 + sunInt*1.1;

  sunLight.position.set( Math.cos(sunAngle)*9, Math.sin(sunAngle)*9, 4);

  // 云朵缓慢漂移
  clouds.forEach((cg,idx)=>{
    cg.position.x += Math.sin(t*0.12+idx)*0.0022;
    cg.position.z += Math.cos(t*0.09+idx)*0.0018;
    cg.rotation.y += 0.0012;
  });

  // 整体玻璃盒轻微悬浮呼吸
  glassGroup.position.y = 0.2 + Math.sin(t*0.45)*0.14;
  glassGroup.rotation.y += 0.0012;

  controls.update();
  composer.render();
}
animate();
})();
</script>
</body>
</html>
