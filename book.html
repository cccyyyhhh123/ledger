<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0d12">
<meta name="author" content="Yuhan.Cai">
<title>The ledger — Ledger</title>
<meta name="description" content="The working ledger: add a line, filter by month or type, delete a mistake. Everything is kept in this browser.">
<meta name="author" content="Yuhan.Cai">
<link rel="icon" href="images/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta property="og:title" content="The ledger — Ledger">
<meta property="og:description" content="Add a line, filter by month, delete a mistake — the working screen of a shared expense book.">
<meta property="og:image" content="https://cccyyyhhh123.github.io/c-y-h-h-h/images/og-image.jpg">
<meta property="og:url" content="https://cccyyyhhh123.github.io/c-y-h-h-h/book.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------
     The working ledger, in the dark system the rest of the site now
     uses: near-black surfaces, hairlines, one purple accent. Only the
     theme changed — every control and every line of logic is the same.
     --------------------------------------------------------------- */
  :root {
    --bg: #0d0d12;
    --panel: #0f0f15;
    --soft: rgba(255, 255, 255, 0.03);
    --ink: #ffffff;
    --ink-2: rgba(255, 255, 255, 0.72);
    --muted: rgba(255, 255, 255, 0.45);
    --line: rgba(255, 255, 255, 0.07);
    --field: #131319;
    --accent: #a855f7;
    --accent-deep: #9333ea;
    --neg: #f87171;
    --r-panel: 16px;
    --r-control: 10px;
    --r-chip: 6px;
    --shell: 1180px;
    --gutter: 20px;

    --s1: 0.8125rem;
    --s2: 0.9375rem;
    --s3: 1.0625rem;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: var(--s3);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    color-scheme: dark;
  }

  h1, h2, p, dl, dd { margin: 0; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .shell { width: 100%; max-width: var(--shell); margin: 0 auto; padding: 0 24px; }

  /* ---------- the bar ---------- */

  .bar { background: rgba(13, 13, 18, 0.9); border-bottom: 1px solid var(--line); }
  .bar__inner { display: flex; align-items: center; gap: 26px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 1.0625rem; letter-spacing: -0.01em; }
  .brand__mark { position: relative; width: 18px; height: 18px; background: var(--accent); flex: none; border-radius: 5px; }
  .brand__mark::after {
    content: "";
    position: absolute;
    left: -5px;
    top: -5px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bg);
  }

  .bar__links { display: flex; gap: 18px; margin-left: 8px; font-size: var(--s1); }
  .bar__links a { text-decoration: none; color: var(--muted); transition: color 0.2s ease; }
  .bar__links a:hover { color: var(--ink); }
  .bar__key { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .bar__key > span { font-size: var(--s1); color: var(--muted); }
  .keys { display: flex; gap: 3px; }
  .keys span {
    width: 22px; height: 28px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--field);
    font-size: 0.875rem;
    font-variant-numeric: tabular-nums;
  }

  .quiet {
    font: inherit; font-size: var(--s2);
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 7px 12px; border-radius: 999px; cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .quiet:hover { color: var(--ink); border-color: rgba(255, 255, 255, 0.2); }

  /* ---------- page ---------- */

  main { padding: 40px 0 72px; }

  h1 { font-size: 1.75rem; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; }
  .finding { margin-top: 8px; font-size: var(--s2); color: var(--muted); max-width: 68ch; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-panel);
    padding: 24px;
    margin-top: var(--gutter);
  }
  .panel h2 { font-size: var(--s2); font-weight: 600; }

  /* ---------- summary ---------- */

  .summary { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); align-items: center; }
  .summary__lead { padding-right: 32px; }
  .label { font-size: var(--s1); color: var(--muted); display: block; letter-spacing: 0.06em; text-transform: uppercase; }
  .balance { display: flex; align-items: baseline; gap: 2px; margin-top: 6px; font-size: 2.5rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .balance small { font-size: 1.25rem; font-weight: 500; color: var(--muted); }
  .balance.is-negative { color: var(--neg); }
  .meta { margin-top: 10px; font-size: var(--s1); color: var(--muted); font-variant-numeric: tabular-nums; }

  .summary__grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .figure { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--line); border-radius: var(--r-control); padding: 14px 16px; }
  .figure dt { font-size: var(--s1); color: var(--muted); }
  .figure dd { margin: 4px 0 0; font-size: 1.3125rem; font-weight: 500; font-variant-numeric: tabular-nums; }

  /* ---------- add an entry ---------- */

  .entry { display: grid; grid-template-columns: 168px 128px minmax(0, 1fr) 136px minmax(150px, 1.2fr) auto; gap: 12px; align-items: end; margin-top: 16px; }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field > span { font-size: var(--s1); color: var(--muted); }
  .input {
    font: inherit; font-size: var(--s2); color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: var(--r-control);
    padding: 10px 12px;
    width: 100%; min-width: 0; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis;
    transition: border-color 0.2s ease;
  }
  .input::placeholder { color: rgba(255, 255, 255, 0.3); }
  .input:hover { border-color: rgba(255, 255, 255, 0.16); }
  .input:focus-visible { outline: none; border-color: rgba(168, 85, 247, 0.6); box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15); }
  .input--num { font-variant-numeric: tabular-nums; }
  /* ---------- the category field: our own list, in the site's colours ---------- */
  .combo { position: relative; display: block; min-width: 0; }
  .combo__list {
    position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 6px);
    margin: 0; padding: 4px; list-style: none;
    max-height: 13rem; overflow-y: auto;
    background: #14141a;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 10px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
  }
  .combo__list[hidden] { display: none; }
  .combo__option {
    padding: 8px 10px; border-radius: 7px;
    font-size: 0.9375rem; color: rgba(255, 255, 255, 0.78);
    cursor: pointer;
  }
  .combo__option:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
  .combo__option[aria-selected="true"] {
    background: rgba(168, 85, 247, 0.22); color: #fff;
  }
  .combo__empty {
    padding: 8px 10px; font-size: 0.9375rem; color: rgba(255, 255, 255, 0.4);
  }
  .input--date { font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
  /* the real picker sits on top, invisible: tap opens the calendar, the field
     itself always reads in ISO so the page stays in one language */
  .datefield { position: relative; display: block; min-width: 0; }
  .datefield .input--calendar {
    position: absolute; inset: 0; width: 100%; height: 100%; min-width: 0;
    opacity: 0; border: 0; padding: 0; cursor: pointer;
  }

  /* the interactive hover button, now the page's one accent */
  .hbtn {
    --hbtn-flood: #c084fc;
    --hbtn-on: #140a1f;
    position: relative;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 42px; padding: 0 24px;
    border: 1px solid transparent;
    border-radius: 999px;
    background: var(--accent); color: #fff;
    font: inherit; font-size: var(--s2); font-weight: 600; line-height: 1;
    text-decoration: none; cursor: pointer; overflow: hidden;
    transition: background-color 0.2s ease;
  }
  .hbtn:hover { background: var(--accent-deep); }
  .hbtn__dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--hbtn-flood); transition: transform 0.3s ease; }
  .hbtn__label { display: inline-block; white-space: nowrap; transition: transform 0.3s ease, opacity 0.3s ease; }
  .hbtn__ghost {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--hbtn-on); opacity: 0; transform: translateX(48px);
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  .hbtn__ghost svg { width: 1.05em; height: 1.05em; }
  .hbtn:hover .hbtn__dot, .hbtn:focus-visible .hbtn__dot { transform: scale(100.8); }
  .hbtn:hover .hbtn__label, .hbtn:focus-visible .hbtn__label { transform: translateX(48px); opacity: 0; }
  .hbtn:hover .hbtn__ghost, .hbtn:focus-visible .hbtn__ghost { transform: translateX(-16px); opacity: 1; }

  .formnote { margin-top: 12px; font-size: var(--s1); color: var(--neg); min-height: 1.2em; }
  .formnote:empty { min-height: 0; margin-top: 0; }

  /* ---------- entries ---------- */

  .panel__head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .filters { display: flex; gap: 8px; }
  .filters .input { width: auto; min-width: 132px; font-size: var(--s1); padding: 7px 10px; }

  table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  thead th { text-align: left; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.35); padding: 0 10px 10px; }
  thead th.num { text-align: right; }
  tbody td { padding: 14px 10px; border-top: 1px solid var(--line); font-size: var(--s2); vertical-align: middle; color: var(--ink-2); }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody td.date { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody td.note { color: var(--muted); }
  tbody td.actions { text-align: right; }
  tbody tr { transition: background-color 0.2s ease; }
  tbody tr:hover { background: rgba(255, 255, 255, 0.02); }

  .chip {
    display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 3px 9px;
    border: 1px solid var(--line);
    border-radius: var(--r-chip); color: var(--muted);
  }
  .chip--in { background: rgba(168, 85, 247, 0.16); border-color: rgba(168, 85, 247, 0.4); color: #d8b4fe; }

  .amt-in { color: #fff; font-weight: 500; }
  .amt-out { color: var(--muted); }

  .del { font: inherit; font-size: 0.8125rem; color: var(--muted); background: transparent; border: 0; padding: 4px 2px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; border-radius: 4px; transition: color 0.2s ease; }
  .del:hover { color: var(--neg); }

  .empty { margin-top: 18px; font-size: var(--s2); color: var(--muted); max-width: 60ch; }

  /* ---------- phone ---------- */

  @media (max-width: 980px) {
    .entry { grid-template-columns: 1fr 1fr; }
    .entry .field--wide { grid-column: 1 / -1; }
    .entry .hbtn { grid-column: 1 / -1; width: 100%; height: 44px; }
    .summary { grid-template-columns: minmax(0, 1fr); gap: 20px; }
    .summary__lead { padding-right: 0; }
  }

  @media (max-width: 720px) {
    .shell { padding: 0 16px; }
    main { padding: 24px 0 56px; }
    h1 { font-size: 1.375rem; }
    .bar__inner { height: 56px; gap: 14px; }
    .bar__key > span { display: none; }
    .bar__links { display: none; }
    .keys span { width: 19px; height: 25px; font-size: 0.8125rem; }
    .quiet { padding: 6px 10px; }
    .panel { padding: 18px; border-radius: 14px; }
    .balance { font-size: 1.875rem; }
    .summary__grid { grid-template-columns: 1fr 1fr; }
    .filters { width: 100%; }
    .filters .input { flex: 1; }
    thead { display: none; }
    tbody tr { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    tbody td { border: 0; padding: 0; }
    tbody td.date { grid-column: 1; font-size: var(--s1); }
    tbody td.num { grid-column: 2; grid-row: 1; font-size: 1rem; }
    tbody td.type { grid-column: 1; }
    tbody td.cat { grid-column: 1; }
    tbody td.note { grid-column: 1; font-size: var(--s1); }
    tbody td.actions { grid-column: 2; grid-row: 3; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  /* ---------- the sliding highlight behind the menu ---------- */
  .pill__links, .top__links, .bar__links { position: relative; }
  .nav-ink {
    position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none;
    border-radius: 999px; opacity: 0;
    /* frosted glass: a translucent pane, a lit top edge, a soft drop */
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.17), rgba(255, 255, 255, 0.06));
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.28),
      inset 0 -1px 0 rgba(255, 255, 255, 0.06),
      0 6px 16px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(16px) saturate(180%);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                height 0.24s ease, opacity 0.25s ease;
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .nav-ink { background: rgba(255, 255, 255, 0.15); }
  }
  .pill__links a, .top__links a, .bar__links a {
    position: relative; z-index: 1;
    display: inline-flex; align-items: center; height: 34px;
    padding: 0 13px; border-radius: 999px;
  }
  .pill__links, .top__links { gap: 4px; }
  .bar__links { gap: 2px; }
  @media (prefers-reduced-motion: reduce) { .nav-ink { transition: none; } }
</style>
<script src="vendor/anime.min.js"></script>

<body>

<header class="bar">
  <div class="shell bar__inner">
    <a class="brand" href="index.html"><span class="brand__mark" aria-hidden="true"></span>Ledger</a>
    <div class="bar__links">
      <span class="nav-ink" aria-hidden="true"></span>
      <a href="index.html">Home</a>
      <a href="pricing.html">Pricing</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="bar__key">
      <span>Shared key</span>
      <div class="keys" id="currentKey" aria-label="Shared key"></div>
    </div>
    <button class="quiet" type="button" id="leaveBtn">Leave ledger</button>
  </div>
</header>

<main class="shell">
  <h1>Shared ledger</h1>
  <p class="finding" id="finding">Every entry below is visible to everyone holding this key.</p>

  <section class="panel summary" aria-label="Balance and totals">
    <div class="summary__lead">
      <span class="label">Balance</span>
      <p class="balance" id="balance"><span>0</span><small>.00</small></p>
      <p class="meta" id="meta">No entries yet.</p>
    </div>
    <dl class="summary__grid">
      <div class="figure figure--in">
        <dt>In this month</dt>
        <dd id="monthIn">0.00</dd>
      </div>
      <div class="figure figure--out">
        <dt>Out this month</dt>
        <dd id="monthOut">0.00</dd>
      </div>
      <div class="figure figure--plain">
        <dt>Out, all time</dt>
        <dd id="allOut">0.00</dd>
      </div>
    </dl>
  </section>

  <section class="panel">
    <h2>Add an entry</h2>
    <form class="entry" id="entryForm">
      <label class="field">
        <span>Date</span>
        <span class="datefield">
          <input class="input input--date" type="text" id="billDate" placeholder="YYYY-MM-DD"
                 inputmode="numeric" maxlength="10" autocomplete="off" required>
          <input class="input--calendar" type="date" id="billDatePicker" tabindex="-1" aria-hidden="true">
        </span>
      </label>
      <label class="field">
        <span>Type</span>
        <select class="input" id="billType">
          <option value="deposit">Deposit</option>
          <option value="spend">Spend</option>
        </select>
      </label>
      <label class="field">
        <span>Category</span>
        <span class="combo">
          <input class="input" type="text" id="billClass"
                 role="combobox" aria-expanded="false" aria-controls="categoryList"
                 aria-autocomplete="list" aria-label="Category"
                 placeholder="Pick one, or type your own" autocomplete="off"
                 maxlength="40" required>
          <ul class="combo__list" id="categoryList" role="listbox" aria-label="Categories" hidden></ul>
        </span>
      </label>
      <label class="field">
        <span>Amount</span>
        <input class="input input--num" type="number" step="0.01" min="0" placeholder="0.00" id="billMoney" required>
      </label>
      <label class="field field--wide">
        <span>Note</span>
        <input class="input" type="text" placeholder="Optional" id="billNote">
      </label>
      <button class="hbtn" type="submit"><span class="hbtn__dot"></span><span class="hbtn__label">Save entry</span><span class="hbtn__ghost" aria-hidden="true">Save entry <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span></button>
    </form>
    <p class="formnote" id="entryNote" role="status" aria-live="polite"></p>
  </section>

  <section class="panel">
    <div class="panel__head">
      <h2>Entries</h2>
      <div class="filters">
        <select class="input" id="filterMonth" aria-label="Filter by month">
          <option value="">All months</option>
        </select>
        <select class="input" id="filterType" aria-label="Filter by type">
          <option value="">All types</option>
          <option value="deposit">Deposits only</option>
          <option value="spend">Spending only</option>
        </select>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th scope="col">Date</th>
          <th scope="col">Type</th>
          <th scope="col">Category</th>
          <th scope="col" class="num">Amount</th>
          <th scope="col">Note</th>
          <th scope="col"><span class="visually-hidden" hidden>Actions</span></th>
        </tr>
      </thead>
      <tbody id="billList"></tbody>
    </table>
    <p class="empty" id="emptyState" hidden></p>
  </section>
</main>

<script>
  const STORE = "shareBillStorage";

  const TYPE_LABELS = { deposit: "Deposit", spend: "Spend" };
  const CATEGORY_LABELS = {
    "screen-share": "Screen share",
    deposit: "Deposit",
    valorant: "Valorant",
    gifting: "Gifting",
    steam: "Steam",
    "voice-chat": "Voice chat",
    "friend-slot": "Friend slot"
  };

  /* The category field accepts any name. A typed name that matches one of the
     seven built-ins is stored as its id, so the existing books keep their
     labels; anything else is stored as typed. */
  const CATEGORY_BY_LABEL = {};
  Object.keys(CATEGORY_LABELS).forEach((id) => {
    CATEGORY_BY_LABEL[CATEGORY_LABELS[id].toLowerCase()] = id;
  });

  function normaliseCategory(raw) {
    const text = String(raw || "").trim().replace(/\s+/g, " ");
    if (!text) return "";
    const known = CATEGORY_BY_LABEL[text.toLowerCase()];
    return known || text.slice(0, 40);
  }

  /* Categories typed by hand are remembered in this browser and offered again
     next time, so a name only has to be written once. */
  const CUSTOM_STORE = "shareBillCustomCategories";

  function customCategories() {
    try {
      const list = JSON.parse(localStorage.getItem(CUSTOM_STORE));
      return Array.isArray(list) ? list.filter((name) => typeof name === "string") : [];
    } catch (error) {
      return [];
    }
  }

  function rememberCategory(name) {
    if (!name || CATEGORY_LABELS[name]) return;
    const list = customCategories();
    if (list.some((item) => item.toLowerCase() === name.toLowerCase())) return;
    list.unshift(name);
    try {
      localStorage.setItem(CUSTOM_STORE, JSON.stringify(list.slice(0, 20)));
    } catch (error) {
      /* storage full or blocked: the entry is still saved, only the shortcut is lost */
    }
  }

  /* ---------- the category list ----------
     A <datalist> is drawn by the browser and cannot be given the site's colours,
     so the list is ours: an input plus a listbox that we fill and filter. */

  const categoryInput = document.getElementById("billClass");
  const categoryList = document.getElementById("categoryList");
  let activeIndex = -1;

  function allCategories() {
    const builtins = Object.keys(CATEGORY_LABELS).map((id) => CATEGORY_LABELS[id]);
    const seen = new Set(builtins.map((name) => name.toLowerCase()));
    return builtins.concat(customCategories().filter((name) => !seen.has(name.toLowerCase())));
  }

  function optionsFor(query) {
    const q = String(query || "").trim().toLowerCase();
    return allCategories().filter((name) => !q || name.toLowerCase().indexOf(q) !== -1);
  }

  function renderCategoryOptions(query) {
    if (!categoryList) return;
    categoryList.replaceChildren();
    activeIndex = -1;
    categoryInput.removeAttribute("aria-activedescendant");

    const items = optionsFor(query);
    if (!items.length) {
      const empty = document.createElement("li");
      empty.className = "combo__empty";
      empty.textContent = "No match — keep typing to make a new one";
      categoryList.appendChild(empty);
      return;
    }
    items.forEach((name, index) => {
      const option = document.createElement("li");
      option.id = "category-option-" + index;
      option.className = "combo__option";
      option.setAttribute("role", "option");
      option.setAttribute("aria-selected", "false");
      option.textContent = name;
      /* mousedown, not click: it fires before the field loses focus */
      option.addEventListener("mousedown", (event) => {
        event.preventDefault();
        chooseCategory(name);
      });
      categoryList.appendChild(option);
    });
  }

  function openCategoryList() {
    if (!categoryList) return;
    renderCategoryOptions(categoryInput.value);
    categoryList.hidden = false;
    categoryInput.setAttribute("aria-expanded", "true");
  }

  function closeCategoryList() {
    if (!categoryList) return;
    categoryList.hidden = true;
    categoryInput.setAttribute("aria-expanded", "false");
    activeIndex = -1;
    categoryInput.removeAttribute("aria-activedescendant");
  }

  function chooseCategory(name) {
    categoryInput.value = name;
    closeCategoryList();
    categoryInput.focus();
  }

  function moveActive(step) {
    const options = Array.prototype.slice.call(categoryList.querySelectorAll(".combo__option"));
    if (!options.length) return;
    activeIndex = (activeIndex + step + options.length) % options.length;
    options.forEach((option, index) => option.setAttribute("aria-selected", String(index === activeIndex)));
    const active = options[activeIndex];
    categoryInput.setAttribute("aria-activedescendant", active.id);
    active.scrollIntoView({ block: "nearest" });
  }

  if (categoryInput && categoryList) {
    categoryInput.addEventListener("focus", openCategoryList);
    categoryInput.addEventListener("click", openCategoryList);
    categoryInput.addEventListener("input", openCategoryList);

    categoryInput.addEventListener("keydown", (event) => {
      const open = !categoryList.hidden;
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        if (!open) { openCategoryList(); return; }
        moveActive(event.key === "ArrowDown" ? 1 : -1);
        return;
      }
      if (event.key === "Enter" && open && activeIndex >= 0) {
        const options = categoryList.querySelectorAll(".combo__option");
        if (options[activeIndex]) {
          event.preventDefault();
          chooseCategory(options[activeIndex].textContent);
        }
        return;
      }
      if (event.key === "Escape" && open) {
        event.preventDefault();
        closeCategoryList();
      }
    });

    categoryInput.addEventListener("blur", () => {
      /* a tick late, so a click on an option lands first */
      setTimeout(closeCategoryList, 120);
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".combo")) closeCategoryList();
    });
  }

  // Books saved by an earlier build hold these values in Chinese characters. Map
  // them on read so nothing already written in this browser is lost; the keys stay
  // escaped so the file itself is plain ASCII.
  const TYPE_MIGRATION = { "\u5b58": "deposit", "\u6263": "spend" };
  const CATEGORY_MIGRATION = {
    "\u5c4f\u4eab": "screen-share",
    "\u5b58": "deposit",
    "\u74e6": "valorant",
    "\u9001\u793c": "gifting",
    steam: "steam",
    "\u8bed\u804a": "voice-chat",
    "\u597d\u53cb\u4f4d": "friend-slot"
  };

  const money = (value) =>
    Number(value).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  let globalShareKey = sessionStorage.getItem("activeBookKey");
  let shareBooks = JSON.parse(localStorage.getItem(STORE)) || {};

  // This page always opens a book: the key you arrived with, else the last book
  // already saved in this browser, else a fresh one made on the spot. Nothing
  // bounces you back to the landing page.
  if (!globalShareKey || !shareBooks[globalShareKey]) {
    const known = Object.keys(shareBooks);
    globalShareKey = known.length ? known[known.length - 1] : String(Math.floor(100000 + Math.random() * 900000));
    if (!shareBooks[globalShareKey]) shareBooks[globalShareKey] = [];
    localStorage.setItem(STORE, JSON.stringify(shareBooks));
    sessionStorage.setItem("activeBookKey", globalShareKey);
  }

  migrate(shareBooks);
  document.getElementById("currentKey").replaceChildren(
    ...[...globalShareKey].map((digit) => {
      const cell = document.createElement("span");
      cell.textContent = digit;
      return cell;
    })
  );

  const dateInput = document.getElementById("billDate");
  const datePicker = document.getElementById("billDatePicker");
  const today = new Date().toISOString().slice(0, 10);
  dateInput.value = today;
  if (datePicker) {
    datePicker.value = today;
    /* picking a day in the native calendar writes ISO into the visible field */
    datePicker.addEventListener("change", () => {
      if (datePicker.value) dateInput.value = datePicker.value;
    });
  }
  /* typed input is normalised, so 2026/10/7 becomes 2026-10-07 */
  dateInput.addEventListener("blur", () => {
    const match = dateInput.value.trim().replace(/[./]/g, "-").match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (!match) return;
    dateInput.value = match[1] + "-" + match[2].padStart(2, "0") + "-" + match[3].padStart(2, "0");
    if (datePicker) datePicker.value = dateInput.value;
  });

  function migrate(books) {
    let changed = false;
    Object.values(books).forEach((list) => {
      (list || []).forEach((bill) => {
        if (TYPE_MIGRATION[bill.type]) { bill.type = TYPE_MIGRATION[bill.type]; changed = true; }
        if (CATEGORY_MIGRATION[bill.class]) { bill.class = CATEGORY_MIGRATION[bill.class]; changed = true; }
      });
    });
    if (changed) localStorage.setItem(STORE, JSON.stringify(books));
  }

  function saveAllBooks() {
    localStorage.setItem(STORE, JSON.stringify(shareBooks));
  }

  function currentList() {
    return shareBooks[globalShareKey] || [];
  }

  function stats(list) {
    const month = new Date().toISOString().slice(0, 7);
    let monthIn = 0;
    let monthOut = 0;
    let totalIn = 0;
    let totalOut = 0;
    list.forEach((bill) => {
      const amount = Number(bill.money) || 0;
      if (bill.type === "deposit") {
        totalIn += amount;
        if (bill.date.startsWith(month)) monthIn += amount;
      } else {
        totalOut += amount;
        if (bill.date.startsWith(month)) monthOut += amount;
      }
    });
    return { monthIn, monthOut, totalIn, totalOut, balance: totalIn - totalOut };
  }

  function syncMonthFilter() {
    const select = document.getElementById("filterMonth");
    const previous = select.value;
    const months = [...new Set(currentList().map((bill) => bill.date.slice(0, 7)))].sort().reverse();

    select.replaceChildren(new Option("All months", ""));
    months.forEach((month) => select.add(new Option(month, month)));
    select.value = months.includes(previous) ? previous : "";
  }

  let shownBalance = 0;
  let balanceTween = null;

  function paintBalance(value) {
    const el = document.getElementById("balance");
    const parts = money(value).split(".");
    el.replaceChildren();
    const whole = document.createElement("span");
    whole.textContent = parts[0];
    const cents = document.createElement("small");
    cents.textContent = "." + parts[1];
    el.append(whole, cents);
    el.classList.toggle("is-negative", value < 0);
  }

  /* the figure counts to its new value instead of jumping */
  function setBalance(value) {
    const from = shownBalance;
    shownBalance = value;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (balanceTween && balanceTween.pause) balanceTween.pause();
    if (typeof anime === "undefined" || from === value) { paintBalance(value); return; }
    const proxy = { v: from };
    balanceTween = anime({
      targets: proxy, v: value, duration: reduced ? 240 : 900, easing: "easeOutExpo",
      update: () => paintBalance(proxy.v),
      complete: () => paintBalance(value),
    });
  }
  function render() {
    syncMonthFilter();

    const month = document.getElementById("filterMonth").value;
    const type = document.getElementById("filterType").value;
    let rows = [...currentList()];
    if (month) rows = rows.filter((bill) => bill.date.startsWith(month));
    if (type) rows = rows.filter((bill) => bill.type === type);
    rows.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id));

    const body = document.getElementById("billList");
    body.replaceChildren();

    rows.forEach((bill) => {
      const tr = document.createElement("tr");
      const isIn = bill.type === "deposit";

      const dateCell = document.createElement("td");
      dateCell.className = "date";
      dateCell.textContent = bill.date;

      const typeCell = document.createElement("td");
      typeCell.className = "type";
      const chip = document.createElement("span");
      chip.className = isIn ? "chip chip--in" : "chip chip--out";
      chip.textContent = TYPE_LABELS[bill.type] || bill.type;
      typeCell.appendChild(chip);

      const catCell = document.createElement("td");
      catCell.className = "cat";
      catCell.textContent = CATEGORY_LABELS[bill.class] || bill.class;

      const amountCell = document.createElement("td");
      amountCell.className = "num";
      const amount = document.createElement("span");
      amount.className = isIn ? "amt-in" : "amt-out";
      amount.textContent = (isIn ? "+" : "−") + money(bill.money);
      amountCell.appendChild(amount);

      const noteCell = document.createElement("td");
      noteCell.className = "note";
      noteCell.textContent = bill.note || "—";

      const actionCell = document.createElement("td");
      actionCell.className = "actions";
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "del";
      remove.textContent = "Delete";
      remove.setAttribute("aria-label", "Delete the entry from " + bill.date);
      remove.addEventListener("click", () => deleteEntry(bill.id));
      actionCell.appendChild(remove);

      tr.append(dateCell, typeCell, catCell, amountCell, noteCell, actionCell);
      body.appendChild(tr);
    });

    const empty = document.getElementById("emptyState");
    const total = currentList().length;
    if (rows.length === 0) {
      empty.hidden = false;
      empty.textContent = total === 0
        ? "No entries yet. The first deposit or spend lands here, and everyone holding the key sees it."
        : "Nothing matches these filters. Clear them to see the whole book.";
    } else {
      empty.hidden = true;
    }

    const summary = stats(currentList());
    setBalance(summary.balance);

    const meta = document.getElementById("meta");
    meta.textContent = total === 0
      ? "No entries yet."
      : total + (total === 1 ? " entry" : " entries") + " · in " + money(summary.totalIn) + ", out " + money(summary.totalOut);

    document.getElementById("monthIn").textContent = money(summary.monthIn);
    document.getElementById("monthOut").textContent = money(summary.monthOut);
    document.getElementById("allOut").textContent = money(summary.totalOut);

    const finding = document.getElementById("finding");
    finding.classList.toggle("is-warn", summary.balance < 0);
    finding.textContent = findingText(summary, total);
  }

  function findingText(summary, total) {
    if (total === 0) return "An empty book. Add the first entry and the balance starts moving.";
    const monthName = new Date().toLocaleString("en-US", { month: "long" });
    const gap = summary.monthIn - summary.monthOut;
    if (gap === 0) return "Deposits and spending are level in " + monthName + ".";
    if (gap > 0) return "Deposits are " + money(gap) + " ahead of spending in " + monthName + ".";
    return "Spending is " + money(-gap) + " ahead of deposits in " + monthName + "." + (summary.balance < 0 ? " The balance is below zero." : " The balance is dropping.");
  }

  function addEntry(event) {
    event.preventDefault();
    const date = dateInput.value;
    const type = document.getElementById("billType").value;
    const category = normaliseCategory(document.getElementById("billClass").value);
    const amount = Number(document.getElementById("billMoney").value);
    const note = document.getElementById("billNote").value.trim();
    const noteEl = document.getElementById("entryNote");

    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !(amount > 0) || !category) {
      noteEl.textContent = "A date (YYYY-MM-DD), a category and an amount above zero are required.";
      return;
    }

    shareBooks[globalShareKey].push({ id: Date.now(), date, type, class: category, money: amount, note });
    saveAllBooks();
    rememberCategory(category);
    noteEl.textContent = "";
    document.getElementById("billMoney").value = "";
    document.getElementById("billNote").value = "";
    render();
    document.getElementById("billMoney").focus();
  }

  function deleteEntry(id) {
    shareBooks[globalShareKey] = currentList().filter((bill) => bill.id !== id);
    saveAllBooks();
    render();
  }

  document.getElementById("entryForm").addEventListener("submit", addEntry);
  document.getElementById("leaveBtn").addEventListener("click", () => {
    sessionStorage.removeItem("activeBookKey");
    window.location.href = "index.html";
  });
  document.getElementById("filterMonth").addEventListener("change", render);
  document.getElementById("filterType").addEventListener("change", render);

  render();
</script>
<script>
  /* the menu's highlight is one element that moves and resizes to the item
     you picked, then the page changes — a small spring on the way over */
  (function () {
    var bar = document.querySelector('.bar__links');
    if (!bar) return;
    var links = Array.prototype.slice.call(bar.querySelectorAll('a'));
    if (!links.length) return;

    var ink = document.createElement('span');
    ink.className = 'nav-ink';
    ink.setAttribute('aria-hidden', 'true');
    bar.insertBefore(ink, bar.firstChild);

    var calm = matchMedia('(prefers-reduced-motion: reduce)');

    /* measured from rects, not offsets: the link box and the container share
       one coordinate space no matter how either is positioned */
    function place(target) {
      if (!target) return;
      var box = bar.getBoundingClientRect();
      var rect = target.getBoundingClientRect();
      ink.style.width = rect.width + 'px';
      ink.style.height = rect.height + 'px';
      ink.style.transform = 'translate(' + (rect.left - box.left - bar.clientLeft) + 'px,' +
                            (rect.top - box.top - bar.clientTop) + 'px)';
      ink.style.opacity = '1';
    }

    if (document.fonts) document.fonts.ready.then(function () { place(bar.querySelector('a[aria-current="page"]')); });
    var current = bar.querySelector('a[aria-current="page"]');
    if (current) place(current);

    links.forEach(function (link) {
      link.addEventListener('click', function (event) {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
        var href = link.getAttribute('href');
        if (!href || href.charAt(0) === '#') return;
        event.preventDefault();
        place(link);
        if (calm.matches) { location.href = href; return; }
        setTimeout(function () { location.href = href; }, 340);
      });
    });

    addEventListener('resize', function () {
      place(bar.querySelector('a[aria-current="page"]') || current);
    });
  })();</script>
</body>
</html>
